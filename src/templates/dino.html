<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#2f9e44">
<title>Invitación</title>
<meta name="description" content="Invitación de cumpleaños infantil · Template «Dino» (borrador de diseño)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Draft only: self-host these two families (woff2) in production -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   TEMPLATE «DINO»  ·  design tokens  (restyle by changing only this)
   ===================================================================== */
:root{
  --cream:  #fff6dd;
  --ink:    #12452f;
  --leaf:   #4cc15a;
  --leaf-d: #2f9e44;
  --jungle: #1f7a3d;
  --sun:    #ffd23f;
  --orange: #ff8a2b;
  --pink:   #ff8fb1;
  --sky:    #a6e3f5;
  --paper:  #fffdf5;

  --font-display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --font-body:    "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;

  --step--1: clamp(.82rem, .8rem + .1vw, .9rem);
  --step-0:  clamp(1.02rem, .98rem + .2vw, 1.15rem);
  --step-1:  clamp(1.25rem, 1.15rem + .5vw, 1.5rem);
  --step-2:  clamp(1.8rem, 1.5rem + 1.8vw, 2.5rem);
  --step-3:  clamp(2.3rem, 1.8rem + 3vw, 3.5rem);
  --gutter:  clamp(1.1rem, 5.5vw, 2rem);
  --col:     36rem;
  --bw: 3px;                           /* sticker outline */
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip}
body{
  margin:0;min-height:100dvh;color:var(--ink);overflow-x:clip;
  font-family:var(--font-body);font-size:var(--step-0);line-height:1.55;font-weight:600;text-align:center;
  background-color:var(--cream);
  background-image:radial-gradient(color-mix(in oklab,var(--leaf) 22%,transparent) 2px,transparent 2.5px);
  background-size:26px 26px;
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}
.wrap{width:min(100% - 2*var(--gutter), var(--col));margin-inline:auto}
section{padding-block:clamp(2.6rem, 9vw, 4.5rem);position:relative}
.copy{max-width:30rem;margin-inline:auto;text-wrap:balance}
.copy + .copy{margin-top:.9em}
.sec{
  font-family:var(--font-display);font-weight:700;font-size:var(--step-3);line-height:1.02;letter-spacing:-.01em;text-wrap:balance;margin-bottom:1.2rem;
  text-decoration:underline wavy var(--orange) 4px;text-underline-offset:.22em;text-decoration-skip-ink:none;
}

/* ---------- sticker art (SVG classes used inside <symbol>) ---------- */
.o{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.f-green{fill:var(--leaf)}.f-green2{fill:var(--leaf-d)}.f-belly{fill:#fff1b8}.f-orange{fill:var(--orange)}
.f-yellow{fill:var(--sun)}.f-white{fill:#fff}.f-pink{fill:var(--pink)}.f-red{fill:#ef476f}.f-brown{fill:#a87444}.f-sky{fill:var(--sky)}.f-ink{fill:var(--ink)}
.s-ink{stroke:var(--ink);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;padding:.7rem 1.7rem;
  border:var(--bw) solid var(--ink);border-radius:999px;background:var(--sun);color:var(--ink);
  font-family:var(--font-display);font-weight:600;font-size:1.15rem;letter-spacing:.01em;text-decoration:none;
  box-shadow:0 5px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn--green{background:var(--leaf)}
.btn--white{background:#fff}
.btn--orange{background:var(--orange)}
.btn--pink{background:var(--pink)}
.btn svg{width:1.3rem;height:1.3rem}

/* ---------- reveal / motion (progressive) ---------- */
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .pop{animation:pop linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
    @keyframes pop{from{opacity:0;scale:.82;translate:0 2rem}60%{scale:1.04}to{opacity:1;scale:1;translate:0 0}}
  }
}
@media (prefers-reduced-motion: no-preference){
  .bob{animation:bob 3.2s ease-in-out infinite}
  .sway{animation:sway 5s ease-in-out infinite;transform-origin:50% 100%}
  .wiggle{animation:wiggle 2.8s ease-in-out infinite}
  @keyframes bob{50%{translate:0 -.6rem}}
  @keyframes sway{50%{rotate:5deg}}
  @keyframes wiggle{0%,100%{rotate:-3deg}50%{rotate:3deg}}
}

/* =====================================================================
   TOP TOOLS
   ===================================================================== */
.tools{position:fixed;inset:max(.7rem,env(safe-area-inset-top)) max(.7rem,env(safe-area-inset-right)) auto max(.7rem,env(safe-area-inset-left));display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.tools > *{pointer-events:auto}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.9rem;min-width:2.9rem;padding-inline:.9rem;
  background:#fff;border:var(--bw) solid var(--ink);border-radius:999px;box-shadow:0 3px 0 var(--ink);
  font-family:var(--font-display);font-weight:600;font-size:.95rem;
}
.chip svg{width:1.25rem;height:1.25rem}
.lang button{all:unset;cursor:pointer;padding:.15rem .4rem;border-radius:999px;opacity:.55}
.lang button[aria-pressed="true"]{opacity:1;background:var(--sun)}
.lang button:focus-visible{outline:3px solid var(--orange)}
#music[hidden]{display:none}
#music .bars{display:none;gap:3px;align-items:flex-end;height:1.1rem}
#music[aria-pressed="true"] .bars{display:flex}
#music[aria-pressed="true"] .ico-note{display:none}
#music[aria-pressed="true"]{background:var(--leaf)}
.bars i{width:4px;background:var(--ink);border-radius:2px;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(1){height:40%}.bars i:nth-child(2){height:100%;animation-delay:.2s}.bars i:nth-child(3){height:60%;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){.bars i{animation:none}}

/* =====================================================================
   GATE
   ===================================================================== */
dialog{border:0;padding:0;background:none;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgb(18 69 47 / .75);backdrop-filter:blur(5px)}
#gate{width:100%;height:100dvh;display:none;place-items:center;padding:1.2rem;overflow:hidden}
#gate[open]{display:grid}
#gate::backdrop{background:radial-gradient(circle at 50% 20%,#6fd07a,#1f7a3d 70%)}
.gate-card{
  position:relative;width:min(100%,24rem);background:var(--paper);border:var(--bw) solid var(--ink);border-radius:2rem;
  padding:6.5rem 1.6rem 1.8rem;box-shadow:0 8px 0 var(--ink);animation:drop .7s cubic-bezier(.3,1.4,.5,1) both;
}
.gate-card .peek{position:absolute;left:50%;top:-4.6rem;translate:-50% 0;width:11rem;height:auto}
.gate-card h2{font-family:var(--font-display);font-weight:700;font-size:var(--step-2);line-height:1.05;margin-bottom:1.4rem;text-wrap:balance}
@keyframes drop{from{opacity:0;translate:0 -3rem;scale:.9}}

/* =====================================================================
   1 · COVER
   ===================================================================== */
.cover{
  min-height:100dvh;padding:max(5rem,env(safe-area-inset-top)) var(--gutter) 6rem;position:relative;overflow:clip;
  background:
    radial-gradient(circle at 20% 0%,#7fe08a 0,transparent 55%),
    linear-gradient(#4cc15a,#2f9e44);
  display:grid;align-content:center;justify-items:center;gap:1rem;color:#fff;
}
.leaf{position:absolute;width:clamp(7rem,32vw,12rem);height:auto;pointer-events:none}
.leaf.a{left:-2.5rem;top:2.5rem;rotate:-20deg}.leaf.b{right:-2.8rem;top:7rem;rotate:200deg;scale:-1 1}
.leaf.c{left:-3rem;bottom:7rem;rotate:-70deg}.leaf.d{right:-3rem;bottom:6rem;rotate:70deg}
.hello{font-family:var(--font-display);font-weight:600;font-size:var(--step-1);color:#fff6c9;text-shadow:0 2px 0 rgb(18 69 47 / .6);position:relative}
.name{
  font-family:var(--font-display);font-weight:700;font-size:clamp(4.2rem,24vw,9rem);line-height:.9;letter-spacing:-.01em;color:#fff6c9;
  paint-order:stroke fill;-webkit-text-stroke:10px var(--ink);text-shadow:0 8px 0 var(--ink);position:relative;word-break:break-word;margin-top:-.2rem;
}
.stage{position:relative;width:min(100%,22rem);margin-top:.6rem}
.egg{
  width:min(66vw,15rem);aspect-ratio:4/5;margin-inline:auto;background:var(--sun);overflow:hidden;position:relative;
  border:var(--bw) solid var(--ink);box-shadow:0 8px 0 var(--ink);
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
}
.egg svg{width:100%;height:100%}
.egg .ph-label{position:absolute;left:50%;bottom:9%;translate:-50% 0;white-space:nowrap;font-family:var(--font-display);font-weight:600;font-size:.85rem;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.1rem .8rem}
.rex-peek{position:absolute;right:-5.5rem;bottom:-1.6rem;width:11rem;height:auto;z-index:2;transform-origin:30% 90%}
.age{
  position:absolute;left:-1.6rem;top:-1rem;width:6.2rem;aspect-ratio:1;border-radius:50%;background:var(--orange);border:var(--bw) solid var(--ink);
  box-shadow:0 5px 0 var(--ink);display:grid;place-content:center;rotate:-10deg;color:#fff;z-index:3;line-height:1;
}
.age:has(b[hidden]){display:none}
.age b{font-family:var(--font-display);font-weight:700;font-size:3.1rem;text-shadow:0 3px 0 var(--ink)}
.age span{font-family:var(--font-display);font-weight:600;font-size:.95rem;text-shadow:0 2px 0 var(--ink)}
.facts-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.5rem;position:relative}
.sticker{
  display:inline-flex;align-items:center;gap:.5rem;background:#fff;color:var(--ink);border:var(--bw) solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);
  padding:.5rem 1rem;font-family:var(--font-display);font-weight:600;font-size:1.02rem;
}
.sticker svg{width:1.2rem;height:1.2rem;flex:none}
.wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:3.4rem;color:var(--cream)}
.hint{position:absolute;left:50%;bottom:3.7rem;translate:-50% 0;font-family:var(--font-display);font-weight:600;color:#fff;font-size:.95rem;opacity:.9}

/* =====================================================================
   2 · EXPLORER PASS
   ===================================================================== */
.pass{
  background:var(--paper);border:var(--bw) solid var(--ink);border-radius:1.8rem;box-shadow:0 7px 0 var(--ink);position:relative;rotate:-1.2deg;
  padding:3.2rem 1.3rem 1.5rem;margin-top:1.5rem;
}
.pass::after{content:"";position:absolute;inset:.55rem;border:2px dashed color-mix(in oklab,var(--ink) 35%,transparent);border-radius:1.3rem;pointer-events:none}
.ribbon{
  position:absolute;left:50%;top:-1.4rem;translate:-50% 0;background:var(--leaf-d);color:#fff;border:var(--bw) solid var(--ink);box-shadow:0 4px 0 var(--ink);
  font-family:var(--font-display);font-weight:600;font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;padding:.45rem 1.4rem;border-radius:.7rem;white-space:nowrap;z-index:2;
}
.pass .rex-mini{position:absolute;right:-1rem;top:-3.2rem;width:5rem;rotate:10deg;z-index:3}
.pass .guest{font-family:var(--font-display);font-weight:700;font-size:var(--step-2);line-height:1.05;margin-bottom:1.1rem;text-wrap:balance}
.pass dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:.7rem;position:relative;z-index:1}
.pass dl > div{background:color-mix(in oklab,var(--sun) 28%,#fff);border:2px solid var(--ink);border-radius:1rem;padding:.55rem .6rem}
.pass dl .full{grid-column:1/-1}
.pass dt{font-family:var(--font-display);font-weight:500;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.pass dd{margin:.05rem 0 0;font-family:var(--font-display);font-weight:600;font-size:1.2rem;line-height:1.2}
.pass dd.msg{font-family:var(--font-body);font-weight:700;font-size:1rem}
.status{display:inline-flex;align-items:center;gap:.4rem}
.status::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--orange);border:2px solid var(--ink)}

/* =====================================================================
   3 · QUOTE · COUNTDOWN
   ===================================================================== */
.bubble{
  position:relative;background:#fff;border:var(--bw) solid var(--ink);border-radius:2rem;box-shadow:0 6px 0 var(--ink);padding:1.6rem 1.4rem;margin-bottom:3rem;
}
.bubble::after,.bubble::before{content:"";position:absolute;left:3.4rem;bottom:-1.5rem;width:2rem;height:2rem;background:#fff;border:var(--bw) solid var(--ink);border-top:0;border-left:0;rotate:45deg;skew:-8deg;border-radius:0 0 .6rem 0}
.bubble::before{display:none}
.bubble p{font-family:var(--font-display);font-weight:500;font-size:var(--step-1);line-height:1.3;text-wrap:balance}
.bubble p:first-child{font-weight:700;font-size:var(--step-2);color:var(--orange);text-shadow:0 2px 0 var(--ink)}
.bubble p + p{margin-top:.7rem}
.talker{display:flex;align-items:flex-end;justify-content:flex-start;gap:0;margin-top:-1rem}
.talker svg{width:9rem;height:auto;margin-left:.4rem}
.story{width:min(100%,21rem);margin:2rem auto 0;aspect-ratio:4/3;background:#fff;padding:.6rem .6rem 2.4rem;border:var(--bw) solid var(--ink);box-shadow:0 7px 0 var(--ink);rotate:2deg;position:relative}
.story .inner{width:100%;height:100%;background:var(--sky);overflow:hidden;position:relative;border:2px solid var(--ink)}
.story svg{width:100%;height:100%}
.story img{width:100%;height:100%;object-fit:cover}
.story .ph-label{position:absolute;left:50%;bottom:.7rem;translate:-50% 0;white-space:nowrap;font-family:var(--font-display);font-weight:600;font-size:.85rem;background:#fff;border:2px solid var(--ink);border-radius:999px;padding:.1rem .8rem}
.countdown-title{font-family:var(--font-display);font-weight:600;margin-top:2.4rem;font-size:var(--step-1)}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:.6rem;margin-top:.9rem}
.countdown div{border:var(--bw) solid var(--ink);border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;box-shadow:0 5px 0 var(--ink);aspect-ratio:.86;display:grid;align-content:center;justify-items:center;gap:0}
.countdown div:nth-child(1){background:var(--pink)}.countdown div:nth-child(2){background:var(--sun)}.countdown div:nth-child(3){background:var(--sky)}.countdown div:nth-child(4){background:var(--leaf)}
.countdown b{font-family:var(--font-display);font-weight:700;font-size:clamp(1.8rem,9vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
.countdown span{font-family:var(--font-display);font-weight:600;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase}

/* =====================================================================
   4 · WHERE (treasure map)
   ===================================================================== */
.band{background:var(--leaf);color:var(--ink);border-block:var(--bw) solid var(--ink)}
.band::before,.band::after{content:"";position:absolute;left:0;right:0;height:1.6rem;background:radial-gradient(circle at 1.2rem 0,transparent 1.1rem,var(--leaf) 1.15rem) 0 0/2.4rem 1.6rem repeat-x;pointer-events:none}
.map{
  background:#f8e4ac;border:var(--bw) solid var(--ink);border-radius:1.2rem;box-shadow:0 7px 0 var(--ink);overflow:hidden;margin:0 auto 1.4rem;rotate:-1deg;
}
.map svg{width:100%;height:auto}
.where-name{font-family:var(--font-display);font-weight:700;font-size:var(--step-2);line-height:1.05;margin-bottom:.9rem}
.chips{display:grid;gap:.6rem;margin-bottom:1.5rem}
.chips .sticker{justify-content:flex-start;text-align:left;border-radius:1.2rem;padding:.7rem 1rem;box-shadow:0 4px 0 var(--ink)}
.chips .sticker small{display:block;font-family:var(--font-display);font-weight:500;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.chips .sticker span{display:block;line-height:1.25;font-weight:600}
.actions{display:grid;gap:.9rem;justify-items:center;position:relative}
.menu{position:fixed;margin:0;inset:auto;padding:.5rem;border:var(--bw) solid var(--ink);border-radius:1.2rem;background:#fff;box-shadow:0 6px 0 var(--ink);min-width:15rem;text-align:left}
.menu a,.menu button{display:flex;gap:.6rem;align-items:center;width:100%;padding:.8rem .9rem;border:0;background:none;border-radius:.8rem;font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--ink);text-decoration:none;min-height:3rem;text-align:left}
.menu a:hover,.menu button:hover{background:var(--sun)}
.menu svg{width:1.2rem;height:1.2rem}

/* =====================================================================
   5 · LODGING
   ===================================================================== */
.lodging-card{background:#fff;border:var(--bw) solid var(--ink);border-radius:1.6rem;box-shadow:0 6px 0 var(--ink);padding:1.4rem}

/* =====================================================================
   6 · ADVENTURE PLAN (itinerary)
   ===================================================================== */
.timeline{list-style:none;margin:1.6rem 0 0;padding:0;display:grid;gap:1.1rem;position:relative}
.timeline::before{content:"";position:absolute;left:3.15rem;top:1.5rem;bottom:1.5rem;border-left:4px dotted color-mix(in oklab,var(--ink) 45%,transparent)}
.timeline li{display:grid;grid-template-columns:6.3rem 1fr;gap:1rem;align-items:center;text-align:left;position:relative}
.timeline svg{width:6.3rem;height:6.3rem;padding:.3rem;background:#fff;border:var(--bw) solid var(--ink);border-radius:50%;box-shadow:0 4px 0 var(--ink)}
.timeline li:nth-child(4n+1) svg{background:var(--sun)}.timeline li:nth-child(4n+2) svg{background:var(--pink)}
.timeline li:nth-child(4n+3) svg{background:var(--sky)}.timeline li:nth-child(4n+4) svg{background:#c6f0a8}
.timeline time{display:inline-block;font-family:var(--font-display);font-weight:600;font-size:1rem;background:var(--ink);color:#fff;border-radius:999px;padding:.1rem .8rem;order:-1}
.timeline .txt{display:grid;gap:.3rem;justify-items:start}
.timeline h3{font-family:var(--font-display);font-weight:700;font-size:var(--step-1);line-height:1.1}

/* =====================================================================
   7 · DRESS · 8 · GIFTS · 9 · NOTICE
   ===================================================================== */
.tag{display:inline-block;background:var(--orange);color:#fff;font-family:var(--font-display);font-weight:600;font-size:1.15rem;border:var(--bw) solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:.4rem 1.3rem;border-radius:999px;margin-bottom:1.1rem;rotate:-2deg;text-shadow:0 2px 0 var(--ink)}
.rule{background:#fff;border:var(--bw) solid var(--ink);border-radius:1.4rem;padding:.9rem 1.1rem;margin-top:.8rem;box-shadow:0 4px 0 var(--ink)}
.rule b{display:block;font-family:var(--font-display);font-weight:700;font-size:1.15rem;margin-bottom:.15rem;color:var(--leaf-d)}
.mini-note{margin-top:1.1rem;font-family:var(--font-display);font-weight:500}
.hat{width:7rem;margin:0 auto 1rem}
.gift-art{width:6rem;margin:1.1rem auto 0}
.notice{background:var(--sun);border:var(--bw) solid var(--ink);border-radius:1.8rem;box-shadow:0 7px 0 var(--ink);padding:1.7rem 1.3rem;position:relative}
.notice .sec{font-size:var(--step-2);text-decoration-color:var(--ink)}

/* =====================================================================
   10 · RSVP
   ===================================================================== */
.rsvp{background:var(--orange);border-block:var(--bw) solid var(--ink);overflow:clip}
.rsvp::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff30 2px,transparent 2.5px) 0 0/24px 24px;pointer-events:none}
.rsvp .wrap{position:relative}
.rsvp .sec{color:#fff6c9;paint-order:stroke fill;-webkit-text-stroke:8px var(--ink);text-shadow:0 5px 0 var(--ink);text-decoration:none;font-size:clamp(2.6rem,12vw,4.4rem)}
.rsvp .copy{color:var(--ink);font-weight:700}
.deadline{display:inline-block;background:#fff;border:var(--bw) solid var(--ink);border-radius:999px;box-shadow:0 4px 0 var(--ink);font-family:var(--font-display);font-weight:600;padding:.4rem 1.1rem;margin:1.2rem 0 1.6rem}
.rsvp-actions{display:grid;gap:1rem;justify-items:center}
.rsvp-actions .btn{width:min(100%,19rem);font-size:1.3rem;min-height:3.7rem}
.rsvp .confirmed{display:none;margin-top:.6rem}
.rsvp .confirmed p{font-family:var(--font-display);font-weight:600;font-size:var(--step-2);line-height:1.1;text-wrap:balance}
.rsvp .confirmed strong{color:#fff6c9;paint-order:stroke fill;-webkit-text-stroke:6px var(--ink);font-weight:700;text-shadow:0 4px 0 var(--ink)}
.rsvp .confirmed #confirmed-people{font-size:1.1rem;font-family:var(--font-display);font-weight:600;margin-top:.9rem}
.rsvp .confirmed .btn{margin-top:1.3rem}
.rsvp[data-state="yes"] .ask,.rsvp[data-state="no"] .ask{display:none}
.rsvp[data-state="yes"] .confirmed,.rsvp[data-state="no"] .confirmed{display:block}
.rsvp .corner{position:absolute;width:9rem;bottom:-1.2rem;z-index:0}
.rsvp .corner.l{left:-1.8rem;rotate:-6deg}.rsvp .corner.r{right:-1.8rem;scale:-1 1;rotate:6deg}
.rsvp .wrap{z-index:1;padding-bottom:5.5rem}

#rsvp-dialog{width:min(100% - 1.4rem,27rem);margin:auto;background:var(--paper);color:var(--ink);border:var(--bw) solid var(--ink);border-radius:2rem;box-shadow:0 8px 0 var(--ink)}
#rsvp-dialog[open]{animation:drop .5s cubic-bezier(.3,1.4,.5,1) both}
.form{padding:1.5rem 1.3rem 1.4rem;display:grid;gap:1rem;text-align:left}
.form header{text-align:center}
.form h2{font-family:var(--font-display);font-weight:700;font-size:var(--step-2);line-height:1}
.form .who{margin-top:.3rem;font-family:var(--font-display);font-weight:500;opacity:.75}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;border:0;padding:0;margin:0}
.seg legend{font-family:var(--font-display);font-weight:600;margin-bottom:.45rem;padding:0}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;min-height:3.3rem;border:var(--bw) solid var(--ink);border-radius:1.1rem;font-family:var(--font-display);font-weight:600;font-size:1.05rem;text-align:center;background:#fff;padding:.3rem;transition:.15s}
.seg input:checked + span{background:var(--leaf);box-shadow:0 4px 0 var(--ink);translate:0 -2px}
.seg input[value="no"]:checked + span{background:var(--pink)}
.seg input:focus-visible + span{outline:3px solid var(--orange);outline-offset:2px}
.field label{display:block;font-family:var(--font-display);font-weight:600;margin-bottom:.35rem}
.field select,.field textarea{width:100%;font:inherit;font-weight:700;font-size:1rem;color:var(--ink);background:#fff;border:var(--bw) solid var(--ink);border-radius:1.1rem;padding:.75rem .9rem;min-height:3.2rem}
.field textarea{min-height:6rem;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1.3fr;gap:.7rem;margin-top:.3rem}
.form .btn{width:100%;padding-inline:1rem}

/* =====================================================================
   11 · CONTACT · FOOTER
   ===================================================================== */
.contact .btn{margin-top:1.2rem;background:#5ce08a}
footer{padding:2.5rem var(--gutter) calc(2.5rem + env(safe-area-inset-bottom));display:grid;gap:.8rem;justify-items:center;position:relative}
footer .prints{display:flex;gap:1rem;color:var(--leaf-d);opacity:.9}
footer .prints svg{width:2rem;height:2.4rem}
footer .prints svg:nth-child(odd){rotate:-14deg;translate:0 .6rem}
footer .prints svg:nth-child(even){rotate:14deg}
footer .big{font-family:var(--font-display);font-weight:700;font-size:var(--step-3);line-height:1}
footer small{font-family:var(--font-display);font-weight:600;font-size:1.1rem}

.toast{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));translate:-50% 160%;background:var(--sun);color:var(--ink);border:var(--bw) solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:.8rem 1.3rem;border-radius:999px;font-family:var(--font-display);font-weight:600;z-index:50;opacity:0;visibility:hidden;transition:translate .45s cubic-bezier(.3,1.4,.5,1),opacity .3s,visibility .45s;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{translate:-50% 0;opacity:1;visibility:visible}
@media (min-width:48rem){:root{--col:38rem}}
@media print{.tools,#gate,.hint{display:none!important}}
</style>
</head>

<body>

<!-- =====================================================================
     TOP TOOLS
     ===================================================================== -->
<div class="tools">
  <div class="chip lang" role="group" aria-label="Idioma / Language">
    <button type="button" data-lang="es" aria-pressed="true">ES</button><button type="button" data-lang="en" aria-pressed="false">EN</button>
  </div>
  <button class="chip" id="music" type="button" aria-pressed="false" hidden>
    <svg class="ico-note" aria-hidden="true"><use href="#i-note"/></svg>
    <span class="bars" aria-hidden="true"><i></i><i></i><i></i></span>
  </button>
</div>

<!-- =====================================================================
     GATE
     ===================================================================== -->
<dialog id="gate" aria-labelledby="gate-title">
  <div class="gate-card">
    <svg class="peek wiggle" viewBox="0 0 250 230" aria-hidden="true"><use href="#trex"/></svg>
    <h2 id="gate-title" data-i18n="gate"></h2>
    <button class="btn btn--orange" id="enter" type="button" data-i18n="enter"></button>
  </div>
</dialog>

<main>

<!-- =====================================================================
     1 · COVER
     ===================================================================== -->
<header class="cover">
  <svg class="leaf a sway" viewBox="0 0 120 200" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf b sway" viewBox="0 0 120 200" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf c sway" viewBox="0 0 120 200" aria-hidden="true"><use href="#leaf"/></svg>
  <svg class="leaf d sway" viewBox="0 0 120 200" aria-hidden="true"><use href="#leaf"/></svg>

  <p class="hello" data-i18n="tagline"></p>
  <h1 class="name" data-bind="couple"></h1>

  <div class="stage">
    <div class="age bob"><b data-bind="event.milestone" data-optional></b><span data-i18n="years"></span></div>
    <div class="egg" id="cover-arch">
      <!-- PHOTO PLACEHOLDER: replaced automatically when photos.cover is set -->
      <svg id="cover-ph" viewBox="0 0 200 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <rect width="200" height="250" fill="#a6e3f5"/>
        <circle cx="150" cy="60" r="28" fill="#ffd23f" stroke="#12452f" stroke-width="3"/>
        <path d="M0 170c40-30 80-20 120-4s60 4 80-10v94H0Z" fill="#4cc15a" stroke="#12452f" stroke-width="3"/>
        <path d="M0 210c50-18 100-6 140 4s40 2 60-6v42H0Z" fill="#2f9e44" stroke="#12452f" stroke-width="3"/>
        <g transform="translate(30 90) scale(.56)"><use href="#trex" width="250" height="230"/></g>
      </svg>
      <span class="ph-label" data-i18n="photo"></span>
    </div>
    <svg class="rex-peek wiggle" viewBox="0 0 250 230" aria-hidden="true"><use href="#trex"/></svg>
  </div>

  <div class="facts-row">
    <span class="sticker"><svg aria-hidden="true"><use href="#i-cal"/></svg><span id="cover-when"></span></span>
    <span class="sticker"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-bind="venue.name"></span></span>
  </div>
  <span id="cover-date" hidden></span>
  <span id="long-date" hidden></span>

  <p class="hint" aria-hidden="true" data-i18n="scroll"></p>
  <svg class="wave" viewBox="0 0 1440 60" preserveAspectRatio="none" aria-hidden="true"><path fill="currentColor" d="M0 30C80 0 160 0 240 30S400 60 480 30 640 0 720 30 880 60 960 30 1120 0 1200 30 1360 60 1440 30V60H0Z"/></svg>
</header>

<!-- =====================================================================
     2 · EXPLORER PASS  (values come from the guest record)
     ===================================================================== -->
<section>
  <div class="wrap">
    <article class="pass pop">
      <svg class="rex-mini wiggle" viewBox="0 0 260 180" aria-hidden="true"><use href="#stego"/></svg>
      <span class="ribbon" data-i18n="invited"></span>
      <h2 class="guest" data-bind="guest.name"></h2>
      <dl>
        <div><dt data-i18n="f_people"></dt><dd data-bind="guest.people"></dd></div>
        <div><dt data-i18n="f_desc"></dt><dd data-bind="guest.description"></dd></div>
        <div class="full"><dt data-i18n="f_status"></dt><dd><span class="status" data-bind="guest.status"></span></dd></div>
        <div class="full"><dt data-i18n="f_msg"></dt><dd class="msg" data-bind="guest.message"></dd></div>
      </dl>
    </article>
  </div>
</section>

<!-- =====================================================================
     3 · QUOTE · COUNTDOWN
     ===================================================================== -->
<section style="padding-top:1rem">
  <div class="wrap">
    <div data-toggle="quote">
      <div class="bubble pop">
        <p data-i18n="q1"></p>
        <p data-i18n="q2"></p>
      </div>
      <div class="talker"><svg class="bob" viewBox="0 0 250 230" aria-hidden="true"><use href="#trex"/></svg></div>
    </div>

    <figure class="story pop" id="story-fig" style="margin-bottom:0">
      <div class="inner">
        <svg id="story-ph" viewBox="0 0 300 220" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <rect width="300" height="220" fill="#a6e3f5"/>
          <circle cx="240" cy="50" r="24" fill="#ffd23f" stroke="#12452f" stroke-width="3"/>
          <path d="M0 150c60-30 120-20 180-4s80 0 120-14v88H0Z" fill="#4cc15a" stroke="#12452f" stroke-width="3"/>
          <g transform="translate(34 70) scale(.52)"><use href="#stego" width="260" height="180"/></g>
          <g transform="translate(196 120) scale(.36)"><use href="#palm" width="100" height="140"/></g>
        </svg>
        <span class="ph-label" data-i18n="photo"></span>
      </div>
    </figure>

    <div data-toggle="countdown">
      <p class="countdown-title" data-i18n="hatch"></p>
      <div class="countdown pop" id="countdown" role="timer" aria-live="off">
        <div><b data-k="d">0</b><span data-i18n="c_d"></span></div>
        <div><b data-k="h">0</b><span data-i18n="c_h"></span></div>
        <div><b data-k="m">0</b><span data-i18n="c_m"></span></div>
        <div><b data-k="s">0</b><span data-i18n="c_s"></span></div>
      </div>
    </div>
  </div>
</section>

<!-- =====================================================================
     4 · WHERE (treasure map)
     ===================================================================== -->
<section class="band">
  <div class="wrap" style="padding-block:1.4rem">
    <h2 class="sec pop" data-i18n="where"></h2>
    <div class="map pop" aria-hidden="true">
      <svg viewBox="0 0 320 210">
        <rect width="320" height="210" fill="#f8e4ac"/>
        <g fill="#e7c978" opacity=".5"><circle cx="40" cy="170" r="30"/><circle cx="280" cy="40" r="34"/><circle cx="150" cy="190" r="22"/></g>
        <g transform="translate(18 16) scale(.62)"><use href="#volcano" width="160" height="120"/></g>
        <g transform="translate(236 118) scale(.62)"><use href="#palm" width="100" height="140"/></g>
        <g transform="translate(14 126) scale(.5)"><use href="#palm" width="100" height="140"/></g>
        <path d="M70 100C110 150 150 40 190 90S250 150 262 118" fill="none" stroke="#12452f" stroke-width="3.500" stroke-dasharray="2 9" stroke-linecap="round"/>
        <g color="#12452f" opacity=".7"><g transform="translate(96 124) rotate(30) scale(.34)"><use href="#print" width="60" height="70"/></g><g transform="translate(146 66) rotate(-20) scale(.34)"><use href="#print" width="60" height="70"/></g></g>
        <g transform="translate(262 108)"><path d="M-14 -14 14 14M14 -14-14 14" stroke="#ef476f" stroke-width="7" stroke-linecap="round"/><path d="M-14 -14 14 14M14 -14-14 14" stroke="#12452f" stroke-width="2" stroke-linecap="round"/></g>
        <g transform="translate(232 148)" opacity=".0"><circle r="3"/></g>
        <g transform="translate(40 190)"><path d="M0 0h30" stroke="#12452f" stroke-width="2"/></g>
        <g transform="translate(274 186)" fill="none" stroke="#12452f" stroke-width="2"><circle r="14"/><path d="M0 -14V14M-14 0H14"/><path d="M0 -10 4 0 0 10-4 0Z" fill="#ef476f"/></g>
      </svg>
    </div>
    <p class="where-name pop" data-bind="venue.name"></p>
    <div class="chips pop">
      <div class="sticker"><svg aria-hidden="true"><use href="#i-cal"/></svg><div><small data-i18n="when"></small><span id="when-v"></span></div></div>
      <div class="sticker"><svg aria-hidden="true"><use href="#i-pin"/></svg><div><small data-i18n="address"></small><span data-bind="venue.address"></span></div></div>
    </div>
    <div class="actions pop">
      <a class="btn btn--white" id="map" href="#" target="_blank" rel="noopener"><svg aria-hidden="true"><use href="#i-pin"/></svg><span data-i18n="map"></span></a>

/* =====================================================================
   DATA  +  helpers
   ===================================================================== */
const CFG = JSON.parse(document.getElementById("invitation-data").textContent);
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

const AVAILABLE = CFG.languages?.available?.length ? CFG.languages.available : ["es","en"];
let lang = store.get("inv-lang") || CFG.languages?.default || (navigator.language||"es").slice(0,2);
if(!AVAILABLE.includes(lang) || !T[lang]) lang = CFG.languages?.default || "es";

const get  = (path)=>path.split(".").reduce((o,k)=>o?.[k],CFG);
const pick = (v)=> (v && typeof v==="object" && !Array.isArray(v)) ? (v[lang] ?? v[CFG.languages?.default] ?? Object.values(v)[0]) : v;
const copy = ()=>({ ...T[lang], ...(CFG.copy?.[lang]||{}) });
const TZ   = CFG.event?.timeZone;
const fmt  = (o)=> new Intl.DateTimeFormat(lang, TZ ? {...o, timeZone:TZ} : o);

/* Safe rich text: only <br> / newline become line breaks; everything else is plain text (no HTML injection). */
function setRich(el, str){
  el.textContent = "";
  String(str ?? "").replace(/&amp;/g,"&").split(/<br\s*\/?>|\n/).forEach((part,i)=>{ if(i) el.append(document.createElement("br")); el.append(part); });
}

const EV = {
  start: new Date(CFG.event.start),
  end:   new Date(CFG.event.end || +new Date(CFG.event.start)+6*36e5),
  names: CFG.event.names || [],
  couple: (CFG.event.names||[]).join(" & "),
  rsvpBy: CFG.rsvp?.deadline ? new Date(CFG.rsvp.deadline) : null
};
let answer = CFG.guest?.response?.answer || null;
let people = CFG.guest?.response?.people || CFG.guest?.people || 1;

/* =====================================================================
   RENDER
   ===================================================================== */
const ICON = { arrive:"t-arrive", games:"t-games", food:"t-food", pinata:"t-pinata", cake:"t-cake", ceremony:"t-arrive", party:"t-games", dinner:"t-food", toast:"t-cake" };

function applyConfig(){
  const t = copy();

  // static copy
  $$("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(typeof v==="string") setRich(el,v); });
  $$("[data-i18n-ph]").forEach(el=>{ el.placeholder = t[el.dataset.i18nPh]; });

  // data bindings  (names, guest, venue …)
  $$("[data-bind]").forEach(el=>{
    const k=el.dataset.bind;
    const v = k==="couple" ? EV.couple : pick(get(k));
    setRich(el, v ?? "");
    if("optional" in el.dataset) el.hidden = !v;
  });

  // section switches
  $$("[data-toggle]").forEach(el=>{
    const on = CFG.sections?.[el.dataset.toggle] !== false;
    const target = el.dataset.scope==="section" ? el.closest("section") : el;
    if(target) target.hidden = !on;
  });

  // language switcher: only the languages offered for this event
  $$(".lang button").forEach(b=>{ b.hidden = !AVAILABLE.includes(b.dataset.lang); b.setAttribute("aria-pressed", b.dataset.lang===lang); });
  $(".lang").hidden = AVAILABLE.length < 2;

  // dates
  const dShort = fmt({day:"numeric",month:"long",year:"numeric"});
  const time = fmt({hour:"numeric",minute:"2-digit"}).format(EV.start);
  $("#long-date").textContent = `${fmt({weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(EV.start)} · ${time}`;
  $("#when-v").textContent = `${dShort.format(EV.start)} · ${time}`;
  const P = Object.fromEntries(new Intl.DateTimeFormat("en-US",{day:"2-digit",month:"2-digit",year:"numeric",...(TZ?{timeZone:TZ}:{})}).formatToParts(EV.start).map(p=>[p.type,p.value]));
  $("#cover-date").textContent = [P.day,P.month,P.year.slice(-2)].join(" . ");
  $("#cover-date").setAttribute("aria-label", dShort.format(EV.start));
  if(EV.rsvpBy) $("#deadline").textContent = t.deadline(dShort.format(EV.rsvpBy)); else $("#deadline").hidden = true;

  // «Dino» extras: short date on the cover sticker
  $("#cover-when").textContent = dShort.format(EV.start) + " · " + time;

  // title + a11y
  document.title = `${EV.couple} · ${t.invited.replace(/[¡!]/g,"")}`;

  // itinerary
  const tl = $("#timeline"); tl.textContent = "";
  (CFG.itinerary||[]).forEach(it=>{
    const [h,m] = String(it.time||"00:00").split(":").map(Number);
    const d = new Date(Date.UTC(2000,0,1,h||0,m||0));
    const li = document.createElement("li"); li.className="reveal";
    li.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#${ICON[it.icon]||"t-arch"}"/></svg>`;
    const tm = document.createElement("time"); tm.dateTime = it.time; tm.textContent = new Intl.DateTimeFormat(lang,{hour:"numeric",minute:"2-digit",timeZone:"UTC"}).format(d);
    const h3 = document.createElement("h3"); setRich(h3, pick(it.title));
    const box = document.createElement("div"); box.className="txt"; box.append(tm,h3); li.append(box); tl.append(li);
  });

  // links
  const addr = encodeURIComponent(`${CFG.venue?.name||""} ${CFG.venue?.address||""}`.trim());
  $("#map").href = CFG.venue?.mapUrl || `https://www.google.com/maps/search/?api=1&query=${addr}`;
  const hl = $("#hotels-link"); if(CFG.lodging?.url) hl.href = CFG.lodging.url; else hl.hidden = true;
  const wa = $("#wa"); if(CFG.contact?.whatsapp) wa.href = `https://wa.me/${String(CFG.contact.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(EV.couple)}`; else wa.hidden = true;

  // people selector
  const max = Math.max(1, CFG.guest?.maxPeople || CFG.guest?.people || 1), sel = $("#people");
  sel.textContent = "";
  for(let i=1;i<=max;i++){ const o=new Option(String(i),String(i)); o.selected = i===Math.min(people,max); sel.add(o); }

  // photos
  setPhoto("#cover-arch","#cover-ph",CFG.photos?.cover,"eager");
  setPhoto("#story-fig","#story-ph",CFG.photos?.story,"lazy");

  renderRsvp();
}

function setPhoto(box, ph, url, loading){
  const wrap = $(box), svg = $(ph);
  wrap.querySelector("img")?.remove();
  const real = !!url;
  svg.hidden = real; $$(".ph-label",wrap).forEach(l=>l.hidden=real);
  if(real){
    const img = new Image(); img.src=url; img.alt=EV.couple; img.loading=loading; img.decoding="async";
    img.style.cssText="width:100%;height:100%;object-fit:cover";
    wrap.prepend(img);
  } else { wrap.setAttribute("role","img"); wrap.setAttribute("aria-label",EV.couple); }
}

function renderRsvp(){
  const t = copy(), sec = $("#rsvp");
  sec.dataset.state = answer || "";
  if(!answer) return;
  const d = fmt({day:"numeric",month:"long",year:"numeric"}).format(new Date());
  const [a,b,c] = (answer==="yes"?t.yes_text:t.no_text)(d);
  const box = $("#confirmed-text"); box.textContent = a; const st=document.createElement("strong"); st.textContent=b; box.append(st, c);
  $("#confirmed-people").textContent = answer==="yes" ? t.people_text(people) : "";
}

function tick(){
  let ms = Math.max(0, EV.start - Date.now());
  const d=Math.floor(ms/864e5); ms%=864e5; const h=Math.floor(ms/36e5); ms%=36e5; const m=Math.floor(ms/6e4); const s=Math.floor(ms%6e4/1e3);
  const v={d,h,m,s}; $$("#countdown [data-k]").forEach(el=>el.textContent=String(v[el.dataset.k]).padStart(el.dataset.k==="d"?1:2,"0"));
}
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast.id); toast.id=setTimeout(()=>el.classList.remove("show"),2800); }

/* =====================================================================
   LANGUAGE
   ===================================================================== */
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; store.set("inv-lang",lang); applyConfig(); syncMusicLabel(); }));

/* =====================================================================
   MUSIC  (chosen by the host; starts after the guest taps “Ingresar” – browsers require a tap)
   ===================================================================== */
const music = $("#music");
const audio = CFG.music?.src ? new Audio() : null;
let wantPlay = false;
function syncMusicLabel(){
  const on = music.getAttribute("aria-pressed")==="true";
  const lbl = `${copy().music}${CFG.music?.title ? ": "+CFG.music.title : ""}`;
  music.setAttribute("aria-label", lbl); music.title = lbl; music.dataset.on = on;
}
function setPlaying(on){ music.setAttribute("aria-pressed", String(on)); syncMusicLabel(); }
if(audio){
  audio.src = CFG.music.src; audio.loop = CFG.music.loop !== false; audio.preload = "auto"; audio.volume = 0;
  music.hidden = false;
  const fade = (to)=>{ clearInterval(fade.id); fade.id=setInterval(()=>{ const d=to-audio.volume; if(Math.abs(d)<.04){audio.volume=to;clearInterval(fade.id); if(!to) audio.pause();} else audio.volume=Math.min(1,Math.max(0,audio.volume+Math.sign(d)*.04)); },60); };
  const play  = ()=> audio.play().then(()=>{ wantPlay=true; setPlaying(true); fade(.7); }).catch(()=> setPlaying(false));
  const pause = ()=>{ wantPlay=false; setPlaying(false); fade(0); };
  music.addEventListener("click",()=> audio.paused ? play() : pause());
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ audio.pause(); } else if(wantPlay){ audio.play().catch(()=>{}); } });
  window.__startMusic = play;
}
syncMusicLabel();

/* =====================================================================
   WELCOME GATE
   ===================================================================== */
const gate = $("#gate");
gate.showModal();
gate.addEventListener("cancel",e=>e.preventDefault());
$("#enter").addEventListener("click",()=>{ gate.close(); window.__startMusic?.(); });

/* =====================================================================
   CALENDAR
   ===================================================================== */
const stamp = d=>d.toISOString().replace(/[-:]|\.\d{3}/g,"");
const evTitle = ()=>`${copy().event_of} ${EV.couple}`;
$("#gcal").addEventListener("click",function(){
  this.href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text="+encodeURIComponent(evTitle())
    + "&dates="+stamp(EV.start)+"/"+stamp(EV.end)
    + "&location="+encodeURIComponent(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`);
});
$("#ics").addEventListener("click",()=>{
  const esc = s=>String(s).replace(/([,;\\])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invitation//EN","BEGIN:VEVENT",
    `UID:${stamp(EV.start)}-${esc(EV.couple)}@invitation`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(EV.start)}`,`DTEND:${stamp(EV.end)}`,
    `SUMMARY:${esc(evTitle())}`,`LOCATION:${esc(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`)}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="invitation.ics"; a.click();
  $("#cal-menu").hidePopover?.(); toast(copy().toast_ics);
});
$("#cal-menu").addEventListener("toggle",e=>{
  if(e.newState!=="open") return;
  const r=$("#cal-btn").getBoundingClientRect(), m=e.target, w=m.offsetWidth;
  m.style.top=(r.bottom+8)+"px"; m.style.left=Math.max(12,Math.min(innerWidth-w-12, r.left+r.width/2-w/2))+"px";
});

/* =====================================================================
   RSVP   →  the platform listens to the "invitation:rsvp" event and saves the reply
   ===================================================================== */
const dlg=$("#rsvp-dialog"), form=$("#rsvp-form");
const syncPeople=()=>{ $(".count-wrap").hidden = form.att.value==="no"; };
$$("[data-answer]").forEach(b=>b.addEventListener("click",()=>{ form.att.value=b.dataset.answer; syncPeople(); dlg.showModal(); }));
$("#modify").addEventListener("click",()=>{ form.att.value=answer||"yes"; syncPeople(); dlg.showModal(); });
form.addEventListener("change",syncPeople);
$("#cancel").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
form.addEventListener("submit",()=>{
  answer=form.att.value; people = answer==="yes" ? +$("#people").value : 0;
  renderRsvp(); toast(copy().toast_sent);
  document.dispatchEvent(new CustomEvent("invitation:rsvp",{detail:{ guest:CFG.guest?.name, answer, people, message:$("#msg").value.trim() }}));
});

/* init */
applyConfig(); tick(); setInterval(tick,1000);
</script>
