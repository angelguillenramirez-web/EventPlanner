<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffd6e8">
<title>Invitación</title>
<meta name="description" content="Invitación de cumpleaños para adultos · Template «Eras» (borrador de diseño)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Draft only: self-host these three families (woff2) in production -->
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500..700&family=Karla:wght@400..700&family=Playfair+Display:ital,wght@0,500..900;1,500..900&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   TEMPLATE «ERAS»  ·  design tokens  (restyle by changing only this)
   Every colour below is one "era" of the palette.
   ===================================================================== */
:root{
  --cream:  #fff8ef;
  --ink:    #1d1730;
  --ink-soft:#5b5470;
  --rose:   #f6a9c9;
  --lav:    #bba9f2;
  --sky:    #a4d6f6;
  --gold:   #e8b94a;
  --gold-l: #ffe9a8;
  --red:    #c4302b;
  --night:  #14123a;
  --sage:   #a9bca9;
  --mint:   #a8e6cf;

  --font-display: "Playfair Display", "Times New Roman", serif;
  --font-hand:    "Caveat", "Comic Sans MS", cursive;
  --font-body:    "Karla", system-ui, -apple-system, "Segoe UI", sans-serif;

  --step--1: clamp(.82rem, .8rem + .1vw, .9rem);
  --step-0:  clamp(1.02rem, .98rem + .2vw, 1.12rem);
  --step-1:  clamp(1.25rem, 1.15rem + .5vw, 1.55rem);
  --step-2:  clamp(1.8rem, 1.5rem + 1.8vw, 2.5rem);
  --step-3:  clamp(2.3rem, 1.8rem + 3vw, 3.5rem);
  --gutter:  clamp(1.1rem, 5.5vw, 2rem);
  --col:     36rem;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip;background:var(--cream)}
body{
  margin:0;min-height:100dvh;background:var(--cream);color:var(--ink);overflow-x:clip;
  font-family:var(--font-body);font-size:var(--step-0);line-height:1.55;text-align:center;-webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:6px}
.wrap{width:min(100% - 2*var(--gutter), var(--col));margin-inline:auto}
section{padding-block:clamp(3rem, 9vw, 5rem);position:relative}
.copy{max-width:30rem;margin-inline:auto;text-wrap:balance;color:var(--ink-soft)}
.copy + .copy{margin-top:.9em}
.hand{font-family:var(--font-hand);font-weight:600}
.sec{
  font-family:var(--font-display);font-weight:800;font-style:italic;font-size:var(--step-3);line-height:1.02;text-wrap:balance;margin-bottom:1.2rem;letter-spacing:-.01em;
}
.sec small{display:block;font-family:var(--font-hand);font-style:normal;font-weight:700;font-size:1.5rem;letter-spacing:0;color:var(--red);margin-bottom:.2rem;rotate:-2deg}

/* ---------- vector art classes ---------- */
.o{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.s-ink{stroke:var(--ink);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.p-rose{fill:var(--rose)}.p-lav{fill:var(--lav)}.p-sky{fill:var(--sky)}.p-gold{fill:var(--gold)}.p-gold-l{fill:var(--gold-l)}
.p-red{fill:var(--red)}.p-white{fill:#fff}.p-ink{fill:var(--ink)}.p-mint{fill:var(--mint)}.p-silver{fill:#d9dcf0}

/* ---------- sparkle sticker ---------- */
.sparkle{position:absolute;pointer-events:none;color:var(--gold)}
@media (prefers-reduced-motion: no-preference){
  .twinkle{animation:twinkle 2.8s ease-in-out infinite}
  .twinkle:nth-child(2n){animation-delay:-.9s}.twinkle:nth-child(3n){animation-delay:-1.7s}
  @keyframes twinkle{0%,100%{scale:.7;opacity:.5;rotate:0deg}50%{scale:1.1;opacity:1;rotate:20deg}}
  .shimmer{background-size:220% 100%;animation:shimmer 5s linear infinite}
  @keyframes shimmer{to{background-position:-220% 0}}
  .drift{animation:drift 7s ease-in-out infinite}
  @keyframes drift{50%{translate:0 -.6rem;rotate:2deg}}
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.3rem;padding:.7rem 1.9rem;
  border:2px solid var(--ink);border-radius:999px;background:var(--ink);color:var(--cream);text-decoration:none;
  font-family:var(--font-body);font-weight:700;font-size:1rem;letter-spacing:.14em;text-transform:uppercase;
  box-shadow:4px 4px 0 var(--rose);transition:transform .15s,box-shadow .15s;
}
.btn:hover{transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--rose)}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--rose)}
.btn--ghost{background:transparent;color:var(--ink)}
.btn--gold{background:linear-gradient(135deg,var(--gold-l),var(--gold));color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn--gold:hover{box-shadow:6px 6px 0 var(--ink)}
.btn--rose{background:var(--rose);color:var(--ink);box-shadow:4px 4px 0 var(--ink)}
.btn svg{width:1.2rem;height:1.2rem}

/* ---------- scroll reveal ---------- */
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .rise{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 50%}
    @keyframes rise{from{opacity:0;translate:0 1.8rem}to{opacity:1;translate:0 0}}
  }
}

/* ---------- friendship-bracelet letter beads ---------- */
.beads{display:flex;flex-wrap:wrap;justify-content:center;gap:.5rem .55rem;padding:.4rem 0}
.bead{
  --s:clamp(2rem,9.4vw,3.3rem);
  width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
  font-family:var(--font-display);font-weight:800;font-size:calc(var(--s)*.5);line-height:1;color:var(--ink);
  box-shadow:inset -.2rem -.28rem 0 rgb(0 0 0 / .13),inset .16rem .16rem 0 rgb(255 255 255 / .55),0 .25rem .5rem rgb(29 23 48 / .22);
}
.bead::before,.bead::after{content:"";position:absolute;top:50%;height:2px;width:.62rem;background:#cdb88e;z-index:-1}
.bead::before{right:100%}.bead::after{left:100%}
.b0{background:var(--rose)}.b1{background:var(--lav)}.b2{background:var(--sky)}.b3{background:var(--gold)}.b4{background:var(--red);color:#fff}.b5{background:var(--mint)}
.beads .gap{width:1rem}
@media (prefers-reduced-motion: no-preference){ .beads .bead{animation:pop .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*55ms)} @keyframes pop{from{scale:0;rotate:-90deg}} }

/* =====================================================================
   TOOLS
   ===================================================================== */
.tools{position:fixed;inset:max(.7rem,env(safe-area-inset-top)) max(.7rem,env(safe-area-inset-right)) auto max(.7rem,env(safe-area-inset-left));display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.tools > *{pointer-events:auto}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.9rem;min-width:2.9rem;padding-inline:.9rem;
  background:rgb(255 248 239 / .9);color:var(--ink);border:2px solid var(--ink);border-radius:999px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:var(--font-body);font-weight:700;font-size:.85rem;letter-spacing:.14em;box-shadow:3px 3px 0 var(--ink);
}
.chip svg{width:1.2rem;height:1.2rem}
.lang button{all:unset;cursor:pointer;padding:.15rem .45rem;border-radius:999px;opacity:.5}
.lang button[aria-pressed="true"]{opacity:1;background:var(--rose)}
.lang button:focus-visible{outline:3px solid var(--ink)}
#music[hidden]{display:none}
#music .bars{display:none;gap:3px;align-items:flex-end;height:1.1rem}
#music[aria-pressed="true"] .bars{display:flex}
#music[aria-pressed="true"] .ico-note{display:none}
#music[aria-pressed="true"]{background:var(--gold-l)}
.bars i{width:4px;background:var(--ink);border-radius:2px;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(1){height:40%}.bars i:nth-child(2){height:100%;animation-delay:.2s}.bars i:nth-child(3){height:60%;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){.bars i{animation:none}}

/* =====================================================================
   GATE
   ===================================================================== */
dialog{border:0;padding:0;background:none;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgb(20 18 58 / .8);backdrop-filter:blur(6px)}
#gate{width:100%;height:100dvh;display:none;place-items:center;padding:1.2rem;overflow:hidden}
#gate[open]{display:grid}
#gate::backdrop{background:linear-gradient(160deg,#ffb8d9,#b9a7f0 50%,#8fc7f0)}
.gate-card{
  position:relative;width:min(100%,23rem);background:var(--cream);border:2px solid var(--ink);border-radius:1.2rem;padding:3.4rem 1.6rem 1.8rem;
  box-shadow:8px 8px 0 var(--ink);rotate:-1.5deg;animation:flip .8s cubic-bezier(.3,1.3,.5,1) both;
}
.gate-card .tape{position:absolute;left:50%;top:-1.1rem;translate:-50% 0;width:7rem;height:2rem;background:rgb(246 169 201 / .85);rotate:2deg;box-shadow:0 2px 4px rgb(0 0 0 / .15)}
.gate-card .bracelet{margin-bottom:1rem}
.gate-card h2{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:var(--step-2);line-height:1.08;margin-bottom:1.5rem;text-wrap:balance}
@keyframes flip{from{opacity:0;rotate:8deg;translate:0 2rem;scale:.9}}

/* =====================================================================
   1 · COVER
   ===================================================================== */
.cover{
  min-height:100dvh;padding:max(5.5rem,env(safe-area-inset-top)) var(--gutter) 5.5rem;position:relative;overflow:clip;
  background:
    radial-gradient(circle at 15% 12%,rgb(255 255 255 / .7) 0,transparent 34%),
    radial-gradient(circle at 90% 70%,rgb(255 233 168 / .55) 0,transparent 38%),
    linear-gradient(165deg,#ffc7e0 0%,#d4c6ff 48%,#b4defa 100%);
  display:grid;align-content:center;justify-items:center;gap:.8rem;
}
.cover::before{ /* glitter */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.8;
  background-image:
    radial-gradient(1.5px 1.5px at 12% 22%,#fff,transparent),radial-gradient(2px 2px at 78% 14%,#fff,transparent),radial-gradient(1.5px 1.5px at 44% 38%,#fff,transparent),
    radial-gradient(2px 2px at 90% 44%,#fff,transparent),radial-gradient(1.5px 1.5px at 8% 64%,#fff,transparent),radial-gradient(2px 2px at 60% 82%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 30% 90%,#fff,transparent),radial-gradient(2px 2px at 95% 92%,#fff,transparent),radial-gradient(1.5px 1.5px at 66% 58%,#fff,transparent);
}
.cover::after{ /* perforated ticket edge */
  content:"";position:absolute;left:0;right:0;bottom:-1px;height:1.1rem;background:radial-gradient(circle at 50% 0,transparent .62rem,var(--cream) .66rem) 0 0/1.4rem 1.1rem repeat-x;
}
.cover > *{position:relative;z-index:1}
.hello{font-family:var(--font-hand);font-weight:700;font-size:clamp(1.7rem,7vw,2.2rem);line-height:1.05;color:var(--ink);max-width:18rem;text-wrap:balance;rotate:-2deg}
.cover .beads{margin-top:.2rem}
.milestone{
  font-family:var(--font-display);font-style:italic;font-weight:900;font-size:clamp(8rem,46vw,17rem);line-height:.8;letter-spacing:-.04em;margin:.4rem 0 0;
  background:linear-gradient(100deg,#b4801a 0%,#ffe9a8 22%,#e8b94a 40%,#fff3c4 55%,#c6902a 75%,#ffe9a8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 .5rem 0 rgb(29 23 48 / .85)) drop-shadow(0 0 1.2rem rgb(255 233 168 / .8));
  position:relative;
}
.milestone-cap{font-family:var(--font-hand);font-weight:700;font-size:1.8rem;margin-top:-.4rem;rotate:-3deg}
.polaroid{
  width:min(68vw,15rem);background:#fff;padding:.7rem .7rem 2.7rem;box-shadow:0 .8rem 2rem rgb(29 23 48 / .28);rotate:3.5deg;position:relative;margin-top:1.2rem;
}
.polaroid::before{content:"";position:absolute;left:50%;top:-1rem;translate:-50% 0;width:5.5rem;height:1.8rem;background:rgb(232 185 74 / .75);rotate:-3deg;box-shadow:0 2px 4px rgb(0 0 0 / .15)}
.polaroid .pic{aspect-ratio:1;overflow:hidden;position:relative;background:var(--sky)}
.polaroid .pic svg{width:100%;height:100%}
.polaroid .cap{position:absolute;left:0;right:0;bottom:.5rem;font-family:var(--font-hand);font-weight:700;font-size:1.35rem;color:var(--ink)}
.polaroid .ph-label{position:absolute;left:50%;bottom:.6rem;translate:-50% 0;white-space:nowrap;background:rgb(255 255 255 / .9);font-family:var(--font-hand);font-weight:700;font-size:1.05rem;padding:0 .6rem;border-radius:999px}
.facts-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.8rem}
.sticker{
  display:inline-flex;align-items:center;gap:.5rem;padding:.45rem 1rem;border-radius:999px;background:#fff;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  font-family:var(--font-body);font-weight:700;font-size:.98rem;
}
.sticker svg{width:1.15rem;height:1.15rem;flex:none}
.hint{position:absolute;left:50%;bottom:2.2rem;translate:-50% 0;font-family:var(--font-hand);font-weight:700;font-size:1.3rem;z-index:2}

/* =====================================================================
   2 · VIP PASS (lanyard card)
   ===================================================================== */
.lanyard{position:relative;width:min(100%,21rem);margin:1rem auto 0;padding-top:4.6rem}
.strap{position:absolute;left:50%;top:-5rem;translate:-50% 0;width:5.4rem;height:8.2rem;background:repeating-linear-gradient(135deg,var(--rose) 0 .7rem,var(--lav) .7rem 1.4rem,var(--sky) 1.4rem 2.1rem);
  clip-path:polygon(0 0,100% 0,88% 100%,12% 100%);box-shadow:0 0 0 2px var(--ink) inset}
.clip{position:absolute;left:50%;top:2.4rem;translate:-50% 0;width:2.2rem;height:2.2rem;border-radius:.6rem;background:linear-gradient(135deg,#f5f5ff,#9ca3c9);border:2px solid var(--ink);z-index:2}
.vip{
  position:relative;color:var(--gold-l);text-align:center;padding:2.2rem 1.3rem 1.4rem;border-radius:1.4rem;overflow:hidden;rotate:-1.5deg;
  background:radial-gradient(circle at 80% 0%,rgb(187 169 242 / .35),transparent 55%),linear-gradient(160deg,#2a2152,#14123a);
  border:2px solid var(--ink);box-shadow:0 0 0 3px var(--gold),8px 10px 0 rgb(29 23 48 / .35);
}
.vip::before{content:"VIP";position:absolute;right:-.6rem;top:-1.6rem;font-family:var(--font-display);font-style:italic;font-weight:900;font-size:8rem;line-height:1;color:rgb(255 233 168 / .08)}
.vip .badge{font-family:var(--font-body);font-weight:700;font-size:.78rem;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
.vip .guest{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:var(--step-2);line-height:1.08;margin:.5rem 0 1.1rem;color:#fff;text-wrap:balance}
.vip dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:.55rem;text-align:left}
.vip dl > div{padding:.5rem .7rem;border-radius:.8rem;background:rgb(255 255 255 / .07);border:1px solid rgb(255 233 168 / .3)}
.vip dl .full{grid-column:1/-1}
.vip dt{font-family:var(--font-body);font-weight:700;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.vip dd{margin:.05rem 0 0;font-weight:600;font-size:1.05rem;color:#fff;line-height:1.25}
.vip dd.msg{font-family:var(--font-hand);font-weight:600;font-size:1.35rem;color:var(--gold-l);line-height:1.2}
.holo{height:.7rem;margin:1.1rem -1.3rem 0;background:linear-gradient(90deg,var(--rose),var(--gold-l),var(--mint),var(--sky),var(--lav),var(--rose));background-size:200% 100%}
.status{display:inline-flex;align-items:center;gap:.45rem}
.status::before{content:"";width:.65rem;height:.65rem;border-radius:50%;background:var(--gold);box-shadow:0 0 10px var(--gold)}

/* =====================================================================
   3 · DIARY PAGE (quote)
   ===================================================================== */
.diary{
  position:relative;background:#fffdf6;border-radius:.4rem;padding:2.6rem 1.4rem 2.4rem 3.2rem;text-align:left;rotate:-1deg;
  box-shadow:0 .6rem 1.6rem rgb(29 23 48 / .18);
  background-image:repeating-linear-gradient(transparent 0 2.05rem,rgb(164 214 246 / .7) 2.05rem 2.15rem);background-position:0 1.1rem;
}
.diary::before{content:"";position:absolute;left:2.4rem;top:0;bottom:0;width:2px;background:rgb(196 48 43 / .45)}
.diary::after{content:"";position:absolute;left:.6rem;top:1.2rem;bottom:1.2rem;width:.9rem;background:radial-gradient(circle,var(--cream) .26rem,#d9d3c4 .3rem,transparent .36rem) 0 0/100% 2.6rem repeat-y}
.diary .tape{position:absolute;right:1.4rem;top:-.9rem;width:5.5rem;height:1.8rem;background:rgb(164 214 246 / .8);rotate:4deg;box-shadow:0 2px 4px rgb(0 0 0 / .15)}
.diary p{font-family:var(--font-hand);font-weight:600;font-size:clamp(1.6rem,6.4vw,2rem);line-height:2.05rem;margin:0;color:#2a2152}
.diary p:first-of-type{font-weight:700;color:var(--red)}
.diary p + p{margin-top:2.05rem}
.diary .doodle{position:absolute;right:1rem;bottom:.8rem;width:3.2rem;color:var(--rose);rotate:12deg}
.story{width:min(100%,20rem);margin:2.4rem auto 0;background:#fff;padding:.6rem .6rem 2.4rem;box-shadow:0 .7rem 1.6rem rgb(29 23 48 / .25);rotate:-3deg;position:relative}
.story::before{content:"";position:absolute;left:50%;top:-.9rem;translate:-50% 0;width:5rem;height:1.7rem;background:rgb(246 169 201 / .85);rotate:3deg;box-shadow:0 2px 4px rgb(0 0 0 / .15)}
.story .inner{aspect-ratio:4/3;overflow:hidden;position:relative;background:var(--lav)}
.story svg,.story img{width:100%;height:100%;object-fit:cover}
.story .ph-label{position:absolute;left:50%;bottom:.5rem;translate:-50% 0;white-space:nowrap;background:rgb(255 255 255 / .9);font-family:var(--font-hand);font-weight:700;font-size:1.05rem;padding:0 .6rem;border-radius:999px}

/* =====================================================================
   4 · COUNTDOWN (midnight)
   ===================================================================== */
.night{
  background:
    radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff,transparent),
    radial-gradient(2px 2px at 70% 85%,#ffe9a8,transparent),radial-gradient(1.5px 1.5px at 20% 90%,#fff,transparent),radial-gradient(1.5px 1.5px at 92% 66%,#fff,transparent),
    linear-gradient(180deg,#14123a,#2a1d63);
  color:#fff;
}
.night .sec{color:#fff}
.countdown-title{font-family:var(--font-hand);font-weight:700;font-size:1.8rem;color:var(--gold-l);rotate:-2deg;margin-bottom:.8rem}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem}
.countdown div{padding:.8rem .2rem .6rem;border-radius:1rem;border:1.5px solid rgb(255 233 168 / .55);background:linear-gradient(rgb(255 255 255 / .1),rgb(255 255 255 / .03));display:grid;gap:.1rem;box-shadow:0 0 1.2rem rgb(232 185 74 / .2)}
.countdown b{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:clamp(1.9rem,9.5vw,3rem);line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff3c4,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.countdown span{font-family:var(--font-body);font-weight:700;font-size:.62rem;letter-spacing:.24em;text-transform:uppercase;color:rgb(255 255 255 / .75)}

/* =====================================================================
   5 · WHERE (ticket)
   ===================================================================== */
.where-bg{background:linear-gradient(180deg,var(--cream),#f4e7fb 60%,var(--cream))}
.tix{position:relative;background:#fff;border:2px solid var(--ink);border-radius:1.2rem;box-shadow:6px 6px 0 var(--ink);text-align:left;overflow:hidden;rotate:1deg}
.tix .art{border-bottom:2px dashed var(--ink);background:#14123a}
.tix .art svg{width:100%;height:auto}
.tix .body{padding:1.1rem 1.2rem 1.3rem}
.tix .where-name{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:var(--step-2);line-height:1.05;margin-bottom:.8rem}
.row-f{display:grid;grid-template-columns:5.2rem 1fr;gap:.8rem;padding:.55rem 0;border-top:1px solid rgb(29 23 48 / .15)}
.row-f dt{font-weight:700;font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;color:var(--red);padding-top:.3rem}
.row-f dd{margin:0;font-weight:600}
.tix dl{margin:0}
.actions{display:grid;gap:.9rem;justify-items:center;margin-top:1.8rem;position:relative}
.menu{position:fixed;margin:0;inset:auto;padding:.4rem;border:2px solid var(--ink);border-radius:1rem;background:var(--cream);color:var(--ink);box-shadow:5px 5px 0 var(--ink);min-width:15rem;text-align:left}
.menu a,.menu button{display:flex;gap:.6rem;align-items:center;width:100%;padding:.8rem .9rem;border:0;background:none;border-radius:.6rem;font-family:var(--font-body);font-weight:700;font-size:.92rem;color:var(--ink);text-decoration:none;min-height:3rem;text-align:left}
.menu a:hover,.menu button:hover{background:var(--rose)}
.menu svg{width:1.2rem;height:1.2rem}

/* 5b · LODGING */
.lodging-card{background:#fff;border:2px solid var(--ink);border-radius:1.2rem;box-shadow:5px 5px 0 var(--ink);padding:1.4rem}

/* =====================================================================
   6 · SETLIST
   ===================================================================== */
.red{background:radial-gradient(circle at 20% 0,rgb(255 255 255 / .12),transparent 50%),linear-gradient(180deg,#8d1a26,#5a0f1a);color:#fff}
.red .sec{color:#fff}.red .sec small{color:var(--gold-l)}
.red .copy{color:rgb(255 255 255 / .85)}
.setlist{
  list-style:none;counter-reset:trk;margin:1.8rem auto 0;padding:2.2rem 1.2rem 1.4rem;background:#fffdf6;color:var(--ink);text-align:left;position:relative;rotate:1.2deg;max-width:26rem;
  box-shadow:0 1rem 2.4rem rgb(0 0 0 / .4);
}
.setlist::before{content:"";position:absolute;left:50%;top:-1rem;translate:-50% 0;width:6rem;height:1.9rem;background:rgb(232 185 74 / .85);rotate:-2deg;box-shadow:0 2px 4px rgb(0 0 0 / .2)}
.setlist li{counter-increment:trk;display:grid;grid-template-columns:2.2rem 3.2rem 1fr;gap:.6rem;align-items:center;padding:.7rem 0;border-bottom:2px dotted rgb(29 23 48 / .3)}
.setlist li:last-child{border-bottom:0}
.setlist li::before{content:counter(trk,decimal-leading-zero);font-family:var(--font-hand);font-weight:700;font-size:1.4rem;color:var(--red)}
.setlist svg{width:3.2rem;height:3.2rem}
.setlist .txt{display:grid;gap:0}
.setlist time{font-family:var(--font-body);font-weight:700;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);order:2}
.setlist h3{font-family:var(--font-hand);font-weight:700;font-size:1.65rem;line-height:1.05}

/* =====================================================================
   7 · PICK YOUR ERA (dress code)
   ===================================================================== */
.eras{display:grid;grid-template-columns:1fr 1fr;gap:.9rem;margin:1.6rem 0 0;padding:0;list-style:none}
.era{border:2px solid var(--ink);border-radius:1rem;padding:.7rem .7rem .8rem;background:#fff;box-shadow:4px 4px 0 var(--ink);text-align:left;position:relative}
.era:nth-child(odd){rotate:-1.5deg}.era:nth-child(even){rotate:1.5deg}
.era i{display:block;height:3.4rem;border-radius:.6rem;border:2px solid var(--ink);margin-bottom:.5rem}
.era b{display:block;font-family:var(--font-display);font-style:italic;font-weight:800;font-size:1.05rem;line-height:1.1}
.era span{font-size:.82rem;color:var(--ink-soft);line-height:1.25;display:block;margin-top:.15rem}
.e1 i{background:linear-gradient(135deg,var(--gold-l),var(--gold) 50%,#fff3c4);}
.e2 i{background:linear-gradient(135deg,#d9c7a7,#b9a283 60%,#e9dcc2)}
.e3 i{background:linear-gradient(135deg,#14123a,#3b2f8a 60%,#14123a)}
.e4 i{background:linear-gradient(135deg,var(--rose),var(--lav) 55%,var(--sky))}
.e5 i{background:linear-gradient(135deg,var(--red),#e24a42 60%,var(--red))}
.e6 i{background:linear-gradient(135deg,#0c0c14,#444 55%,#0c0c14)}
.tip{margin-top:1.6rem;font-family:var(--font-hand);font-weight:700;font-size:1.6rem;color:var(--red);rotate:-1.5deg}
.tag{display:inline-block;font-family:var(--font-body);font-weight:700;font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;background:var(--ink);color:var(--gold-l);padding:.45rem 1.1rem;border-radius:999px;margin-bottom:1rem}

/* =====================================================================
   8 · GIFTS · BRACELET SWAP
   ===================================================================== */
.lavender{background:linear-gradient(180deg,#e6defc,#cfc2f8)}
.gift-box{background:rgb(255 255 255 / .6);border:2px solid var(--ink);border-radius:1.2rem;padding:1.4rem 1.2rem;box-shadow:5px 5px 0 var(--ink)}
.swap{margin-top:1.4rem}

/* =====================================================================
   9 · NOTICE
   ===================================================================== */
.notice{display:inline-flex;align-items:center;gap:.9rem;text-align:left;max-width:30rem;background:var(--ink);color:#fff;border-radius:1.2rem;padding:1rem 1.2rem;box-shadow:5px 5px 0 var(--rose)}
.notice .n18{flex:none;display:grid;place-items:center;width:3rem;height:3rem;border-radius:50%;border:2px solid var(--gold);color:var(--gold);font-family:var(--font-display);font-weight:800;font-style:italic}
.notice .sec{font-size:1.25rem;margin:0 0 .15rem;font-style:italic}
.notice .copy{color:rgb(255 255 255 / .8);font-size:.95rem;margin:0}

/* =====================================================================
   10 · RSVP
   ===================================================================== */
.rsvp{
  background:radial-gradient(circle at 80% 10%,#fff6cf,transparent 50%),linear-gradient(135deg,#f4cf6a,#e8b94a 45%,#f7d97d);
  overflow:clip;border-block:2px solid var(--ink);
}
.rsvp::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 80% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 40% 80%,#fff,transparent),radial-gradient(2px 2px at 92% 76%,#fff,transparent),radial-gradient(1.5px 1.5px at 22% 56%,#fff,transparent)}
.rsvp .wrap{position:relative}
.rsvp .sec small{color:var(--ink)}
.deadline{display:inline-block;background:var(--ink);color:var(--gold-l);font-family:var(--font-body);font-weight:700;font-size:.78rem;letter-spacing:.2em;text-transform:uppercase;padding:.5rem 1.1rem;border-radius:999px;margin:1.2rem 0 1.6rem}
.rsvp-actions{display:grid;gap:1rem;justify-items:center}
.rsvp-actions .btn{width:min(100%,19rem)}
.rsvp .confirmed{display:none;margin-top:.6rem}
.rsvp .confirmed p{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:var(--step-2);line-height:1.1;text-wrap:balance}
.rsvp .confirmed strong{display:inline;background:linear-gradient(transparent 62%,rgb(255 255 255 / .75) 62%)}
.rsvp .confirmed #confirmed-people{font-family:var(--font-hand);font-style:normal;font-weight:700;font-size:1.6rem;margin-top:.8rem}
.rsvp .confirmed .btn{margin-top:1.2rem}
.rsvp[data-state="yes"] .ask,.rsvp[data-state="no"] .ask{display:none}
.rsvp[data-state="yes"] .confirmed,.rsvp[data-state="no"] .confirmed{display:block}
.burst{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.burst svg{position:absolute;width:1.4rem;color:#fff;opacity:0;bottom:-2rem}
@media (prefers-reduced-motion: no-preference){
  .rsvp[data-state="yes"] .burst svg{animation:up 3.2s ease-out forwards}
  @keyframes up{10%{opacity:1}to{translate:0 -32rem;rotate:180deg;opacity:0}}
}

#rsvp-dialog{width:min(100% - 1.4rem,27rem);margin:auto;background:var(--cream);color:var(--ink);border:2px solid var(--ink);border-radius:1.2rem;box-shadow:8px 8px 0 var(--ink)}
#rsvp-dialog[open]{animation:flip .5s cubic-bezier(.3,1.3,.5,1) both}
.form{padding:1.5rem 1.3rem 1.4rem;display:grid;gap:1rem;text-align:left}
.form header{text-align:center}
.form h2{font-family:var(--font-display);font-style:italic;font-weight:800;font-size:var(--step-2);line-height:1}
.form .who{margin-top:.3rem;font-family:var(--font-hand);font-weight:700;font-size:1.4rem;color:var(--red)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;border:0;padding:0;margin:0}
.seg legend{font-weight:700;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;margin-bottom:.45rem;padding:0;color:var(--ink-soft)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;min-height:3.2rem;border:2px solid var(--ink);border-radius:999px;font-weight:700;font-size:.9rem;text-align:center;background:#fff;padding:.3rem .5rem;transition:.15s}
.seg input:checked + span{background:var(--gold);box-shadow:3px 3px 0 var(--ink);translate:-1px -1px}
.seg input[value="no"]:checked + span{background:var(--rose)}
.seg input:focus-visible + span{outline:3px solid var(--ink);outline-offset:2px}
.field label{display:block;font-weight:700;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;margin-bottom:.35rem;color:var(--ink-soft)}
.field select,.field textarea{width:100%;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);background:#fff;border:2px solid var(--ink);border-radius:.9rem;padding:.75rem .9rem;min-height:3.2rem}
.field textarea{min-height:6rem;resize:vertical}
.form .row{display:grid;grid-template-columns:1fr 1.3fr;gap:.7rem;margin-top:.3rem}
.form .btn{width:100%;padding-inline:1rem;letter-spacing:.1em}

/* 11 · CONTACT · FOOTER */
.contact .btn{background:#2f8f5b;border-color:var(--ink);box-shadow:4px 4px 0 var(--ink);margin-top:1.3rem}
footer{padding:2.6rem var(--gutter) calc(2.6rem + env(safe-area-inset-bottom));display:grid;gap:.9rem;justify-items:center;background:var(--night);color:#fff;position:relative}
footer::before{content:"";position:absolute;left:0;right:0;top:-1px;height:1.1rem;background:radial-gradient(circle at 50% 0,transparent .62rem,var(--cream) .66rem) 0 0/1.4rem 1.1rem repeat-x}
footer .beads{margin-top:.8rem}
footer small{font-family:var(--font-hand);font-weight:700;font-size:1.8rem;color:var(--gold-l)}

.toast{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));translate:-50% 160%;background:var(--gold);color:var(--ink);border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:.8rem 1.3rem;border-radius:999px;font-weight:700;z-index:50;opacity:0;visibility:hidden;transition:translate .45s cubic-bezier(.3,1.4,.5,1),opacity .3s,visibility .45s;max-width:calc(100vw - 2rem);text-align:center}
.toast.show{translate:-50% 0;opacity:1;visibility:visible}
@media (min-width:48rem){:root{--col:38rem}}
@media print{.tools,#gate,.hint{display:none!important}}
</style>
</head>

<main>

<!-- =====================================================================
     1 · COVER
     ===================================================================== -->
<header class="cover">
  <svg class="sparkle twinkle" style="left:8%;top:18%;width:1.6rem" viewBox="0 0 24 24" aria-hidden="true"><use href="#spark"/></svg>

    gifts_k:"Tradition", gifts:"Bracelet swap",
    gifts1:"Your presence is my best gift.",
    gifts2:"Bring handmade friendship bracelets to swap with other guests.",
    gifts3:"If you’d like to bring something, there will be a gift table at the entrance.",
    adults:"18+ only", adults_t:"An adults-only night. Thanks for understanding.",
    count_k:"Last track", count:"Are you in?", count_t:"Let me know so I can save you a spot on the dance floor.",
    deadline:(d)=>`Please reply before ${d}`, accept:"Yes, I’m in!", decline:"Can’t make it", modify:"Change reply",
    yes_text:(d)=>["Amazing! ","You’re on the list",`. Replied on ${d}.`], no_text:(d)=>["We’ll miss you: ","you can’t make it",`. Replied on ${d}.`],
    people_text:(n)=>`Confirmed guests: ${n}`,
    form_title:"Coming?", form_att:"Your answer", form_yes:"Yes, I’m in", form_no:"Can’t make it",
    form_people:"How many are coming?", form_ph:"Dietary restrictions or comments", close:"Close", send:"Send",
    contact:"Questions?", contact_t:"Message me on WhatsApp.", withlove:"See you on the dance floor ♥",
    event_of:"Birthday of", music:"Music", toast_sent:"Done! Reply sent.", toast_ics:"File downloaded"
  }
};

/* =====================================================================
   DATA  +  helpers
   ===================================================================== */
const CFG = JSON.parse(document.getElementById("invitation-data").textContent);
const $  = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

const AVAILABLE = CFG.languages?.available?.length ? CFG.languages.available : ["es","en"];
let lang = store.get("inv-lang") || CFG.languages?.default || (navigator.language||"es").slice(0,2);
if(!AVAILABLE.includes(lang) || !T[lang]) lang = CFG.languages?.default || "es";

const get  = (path)=>path.split(".").reduce((o,k)=>o?.[k],CFG);
const pick = (v)=> (v && typeof v==="object" && !Array.isArray(v)) ? (v[lang] ?? v[CFG.languages?.default] ?? Object.values(v)[0]) : v;
const copy = ()=>({ ...T[lang], ...(CFG.copy?.[lang]||{}) });
const TZ   = CFG.event?.timeZone;
const fmt  = (o)=> new Intl.DateTimeFormat(lang, TZ ? {...o, timeZone:TZ} : o);

/* Safe rich text: only <br> / newline become line breaks; everything else is plain text (no HTML injection). */
function setRich(el, str){
  el.textContent = "";
  String(str ?? "").replace(/&amp;/g,"&").split(/<br\s*\/?>|\n/).forEach((part,i)=>{ if(i) el.append(document.createElement("br")); el.append(part); });
}

const EV = {
  start: new Date(CFG.event.start),
  end:   new Date(CFG.event.end || +new Date(CFG.event.start)+6*36e5),
  names: CFG.event.names || [],
  couple: (CFG.event.names||[]).join(" & "),
  rsvpBy: CFG.rsvp?.deadline ? new Date(CFG.rsvp.deadline) : null
};
let answer = CFG.guest?.response?.answer || null;
let people = CFG.guest?.response?.people || CFG.guest?.people || 1;

/* =====================================================================
   RENDER
   ===================================================================== */
const ICON = { arrive:"t-ticket", ceremony:"t-ticket", toast:"t-drink", dinner:"t-dinner", food:"t-dinner", games:"t-mic", karaoke:"t-mic", party:"t-disco", cake:"t-cake", pinata:"t-star", surprise:"t-star" };

function applyConfig(){
  const t = copy();

  // static copy
  $$("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(typeof v==="string") setRich(el,v); });
  $$("[data-i18n-ph]").forEach(el=>{ el.placeholder = t[el.dataset.i18nPh]; });

  // data bindings  (names, guest, venue …)
  $$("[data-bind]").forEach(el=>{
    const k=el.dataset.bind;
    const v = k==="couple" ? EV.couple : pick(get(k));
    setRich(el, v ?? "");
    if("optional" in el.dataset) el.hidden = !v;
  });

  // section switches
  $$("[data-toggle]").forEach(el=>{
    const on = CFG.sections?.[el.dataset.toggle] !== false;
    const target = el.dataset.scope==="section" ? el.closest("section") : el;
    if(target) target.hidden = !on;
  });

  // language switcher: only the languages offered for this event
  $$(".lang button").forEach(b=>{ b.hidden = !AVAILABLE.includes(b.dataset.lang); b.setAttribute("aria-pressed", b.dataset.lang===lang); });
  $(".lang").hidden = AVAILABLE.length < 2;

  // dates
  const dShort = fmt({day:"numeric",month:"long",year:"numeric"});
  const time = fmt({hour:"numeric",minute:"2-digit"}).format(EV.start);
  $("#long-date").textContent = `${fmt({weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(EV.start)} · ${time}`;
  $("#when-v").textContent = `${dShort.format(EV.start)} · ${time}`;
  const P = Object.fromEntries(new Intl.DateTimeFormat("en-US",{day:"2-digit",month:"2-digit",year:"numeric",...(TZ?{timeZone:TZ}:{})}).formatToParts(EV.start).map(p=>[p.type,p.value]));
  $("#cover-date").textContent = [P.day,P.month,P.year.slice(-2)].join(" . ");
  $("#cover-date").setAttribute("aria-label", dShort.format(EV.start));
  if(EV.rsvpBy) $("#deadline").textContent = t.deadline(dShort.format(EV.rsvpBy)); else $("#deadline").hidden = true;

  // «Eras» extras: short date on the cover + friendship-bracelet letter beads from the name
  $("#cover-when").textContent = dShort.format(EV.start) + " · " + time;
  $(".milestone-cap").hidden = !CFG.event.milestone;
  $$("[data-beads]").forEach(el=>{
    el.textContent = ""; let n = 0;
    [...EV.couple].forEach(ch=>{
      if(ch===" "){ const g=document.createElement("span"); g.className="gap"; el.append(g); return; }
      const bd=document.createElement("span"); bd.className="bead b"+(n%6); bd.style.setProperty("--i",n); bd.textContent=ch.toUpperCase(); el.append(bd); n++;
    });
  });

  // title + a11y
  document.title = `${EV.couple} · ${t.invited.replace(/[¡!]/g,"")}`;

  // itinerary
  const tl = $("#timeline"); tl.textContent = "";
  (CFG.itinerary||[]).forEach(it=>{
    const [h,m] = String(it.time||"00:00").split(":").map(Number);
    const d = new Date(Date.UTC(2000,0,1,h||0,m||0));
    const li = document.createElement("li"); li.className="reveal";
    li.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#${ICON[it.icon]||"t-arch"}"/></svg>`;
    const tm = document.createElement("time"); tm.dateTime = it.time; tm.textContent = new Intl.DateTimeFormat(lang,{hour:"numeric",minute:"2-digit",timeZone:"UTC"}).format(d);
    const h3 = document.createElement("h3"); setRich(h3, pick(it.title));
    const box = document.createElement("div"); box.className="txt"; box.append(tm,h3); li.append(box); tl.append(li);
  });

  // links
  const addr = encodeURIComponent(`${CFG.venue?.name||""} ${CFG.venue?.address||""}`.trim());
  $("#map").href = CFG.venue?.mapUrl || `https://www.google.com/maps/search/?api=1&query=${addr}`;
  const hl = $("#hotels-link"); if(CFG.lodging?.url) hl.href = CFG.lodging.url; else hl.hidden = true;
  const wa = $("#wa"); if(CFG.contact?.whatsapp) wa.href = `https://wa.me/${String(CFG.contact.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(EV.couple)}`; else wa.hidden = true;

  // people selector
  const max = Math.max(1, CFG.guest?.maxPeople || CFG.guest?.people || 1), sel = $("#people");
  sel.textContent = "";
  for(let i=1;i<=max;i++){ const o=new Option(String(i),String(i)); o.selected = i===Math.min(people,max); sel.add(o); }

  // photos
  setPhoto("#cover-arch","#cover-ph",CFG.photos?.cover,"eager");
  setPhoto("#story-fig","#story-ph",CFG.photos?.story,"lazy");

  renderRsvp();
}

function setPhoto(box, ph, url, loading){
  const wrap = $(box), svg = $(ph);
  wrap.querySelector("img")?.remove();
  const real = !!url;
  svg.hidden = real; $$(".ph-label",wrap).forEach(l=>l.hidden=real);
  if(real){
    const img = new Image(); img.src=url; img.alt=EV.couple; img.loading=loading; img.decoding="async";
    img.style.cssText="width:100%;height:100%;object-fit:cover";
    wrap.prepend(img);
  } else { wrap.setAttribute("role","img"); wrap.setAttribute("aria-label",EV.couple); }
}

function renderRsvp(){
  const t = copy(), sec = $("#rsvp");
  sec.dataset.state = answer || "";
  if(!answer) return;
  const d = fmt({day:"numeric",month:"long",year:"numeric"}).format(new Date());
  const [a,b,c] = (answer==="yes"?t.yes_text:t.no_text)(d);
  const box = $("#confirmed-text"); box.textContent = a; const st=document.createElement("strong"); st.textContent=b; box.append(st, c);
  $("#confirmed-people").textContent = answer==="yes" ? t.people_text(people) : "";
}

function tick(){
  let ms = Math.max(0, EV.start - Date.now());
  const d=Math.floor(ms/864e5); ms%=864e5; const h=Math.floor(ms/36e5); ms%=36e5; const m=Math.floor(ms/6e4); const s=Math.floor(ms%6e4/1e3);
  const v={d,h,m,s}; $$("#countdown [data-k]").forEach(el=>el.textContent=String(v[el.dataset.k]).padStart(el.dataset.k==="d"?1:2,"0"));
}
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast.id); toast.id=setTimeout(()=>el.classList.remove("show"),2800); }

/* =====================================================================
   LANGUAGE
   ===================================================================== */
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; store.set("inv-lang",lang); applyConfig(); syncMusicLabel(); }));

/* =====================================================================
   MUSIC  (chosen by the host; starts after the guest taps “Ingresar” – browsers require a tap)
   ===================================================================== */
const music = $("#music");
const audio = CFG.music?.src ? new Audio() : null;
let wantPlay = false;
function syncMusicLabel(){
  const on = music.getAttribute("aria-pressed")==="true";
  const lbl = `${copy().music}${CFG.music?.title ? ": "+CFG.music.title : ""}`;
  music.setAttribute("aria-label", lbl); music.title = lbl; music.dataset.on = on;
}
function setPlaying(on){ music.setAttribute("aria-pressed", String(on)); syncMusicLabel(); }
if(audio){
  audio.src = CFG.music.src; audio.loop = CFG.music.loop !== false; audio.preload = "auto"; audio.volume = 0;
  music.hidden = false;
  const fade = (to)=>{ clearInterval(fade.id); fade.id=setInterval(()=>{ const d=to-audio.volume; if(Math.abs(d)<.04){audio.volume=to;clearInterval(fade.id); if(!to) audio.pause();} else audio.volume=Math.min(1,Math.max(0,audio.volume+Math.sign(d)*.04)); },60); };
  const play  = ()=> audio.play().then(()=>{ wantPlay=true; setPlaying(true); fade(.7); }).catch(()=> setPlaying(false));
  const pause = ()=>{ wantPlay=false; setPlaying(false); fade(0); };
  music.addEventListener("click",()=> audio.paused ? play() : pause());
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ audio.pause(); } else if(wantPlay){ audio.play().catch(()=>{}); } });
  window.__startMusic = play;
}
syncMusicLabel();

/* =====================================================================
   WELCOME GATE
   ===================================================================== */
const gate = $("#gate");
gate.showModal();
gate.addEventListener("cancel",e=>e.preventDefault());
$("#enter").addEventListener("click",()=>{ gate.close(); window.__startMusic?.(); });

/* =====================================================================
   CALENDAR
   ===================================================================== */
const stamp = d=>d.toISOString().replace(/[-:]|\.\d{3}/g,"");
const evTitle = ()=>`${copy().event_of} ${EV.couple}`;
$("#gcal").addEventListener("click",function(){
  this.href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text="+encodeURIComponent(evTitle())
    + "&dates="+stamp(EV.start)+"/"+stamp(EV.end)
    + "&location="+encodeURIComponent(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`);
});
$("#ics").addEventListener("click",()=>{
  const esc = s=>String(s).replace(/([,;\\])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invitation//EN","BEGIN:VEVENT",
    `UID:${stamp(EV.start)}-${esc(EV.couple)}@invitation`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(EV.start)}`,`DTEND:${stamp(EV.end)}`,
    `SUMMARY:${esc(evTitle())}`,`LOCATION:${esc(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`)}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="invitation.ics"; a.click();
  $("#cal-menu").hidePopover?.(); toast(copy().toast_ics);
});
$("#cal-menu").addEventListener("toggle",e=>{
  if(e.newState!=="open") return;
  const r=$("#cal-btn").getBoundingClientRect(), m=e.target, w=m.offsetWidth;
  m.style.top=(r.bottom+8)+"px"; m.style.left=Math.max(12,Math.min(innerWidth-w-12, r.left+r.width/2-w/2))+"px";
});

/* =====================================================================
   RSVP   →  the platform listens to the "invitation:rsvp" event and saves the reply
   ===================================================================== */
const dlg=$("#rsvp-dialog"), form=$("#rsvp-form");
const syncPeople=()=>{ $(".count-wrap").hidden = form.att.value==="no"; };
$$("[data-answer]").forEach(b=>b.addEventListener("click",()=>{ form.att.value=b.dataset.answer; syncPeople(); dlg.showModal(); }));
$("#modify").addEventListener("click",()=>{ form.att.value=answer||"yes"; syncPeople(); dlg.showModal(); });
form.addEventListener("change",syncPeople);
$("#cancel").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
form.addEventListener("submit",()=>{
  answer=form.att.value; people = answer==="yes" ? +$("#people").value : 0;
  renderRsvp(); toast(copy().toast_sent);
  document.dispatchEvent(new CustomEvent("invitation:rsvp",{detail:{ guest:CFG.guest?.name, answer, people, message:$("#msg").value.trim() }}));
});

/* init */
applyConfig(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
