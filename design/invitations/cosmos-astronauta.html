<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1033">
<title>Invitación</title>
<meta name="description" content="Invitación de cumpleaños infantil · Template «Cosmos» (borrador de diseño)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Draft only: self-host these two families (woff2) in production -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500..800&family=Quicksand:wght@500..700&display=swap" rel="stylesheet">

<style>
/* =====================================================================
   TEMPLATE «COSMOS»  ·  design tokens  (restyle by changing only this)
   ===================================================================== */
:root{
  --space-1: #0b1033;
  --space-2: #160e45;
  --space-3: #2a1a6b;
  --ink:     #eef2ff;
  --ink-soft:#b7c1ee;
  --cyan:    #5ee7ff;
  --pink:    #ff5fd2;
  --sun:     #ffd84d;
  --orange:  #ff8f3f;
  --navy:    #0b1033;
  --glass:   rgb(255 255 255 / .07);
  --glass-b: rgb(255 255 255 / .22);

  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body:    "Quicksand", system-ui, -apple-system, "Segoe UI", sans-serif;

  --step--1: clamp(.82rem, .8rem + .1vw, .9rem);
  --step-0:  clamp(1.02rem, .98rem + .2vw, 1.15rem);
  --step-1:  clamp(1.25rem, 1.15rem + .5vw, 1.55rem);
  --step-2:  clamp(1.8rem, 1.5rem + 1.8vw, 2.5rem);
  --step-3:  clamp(2.3rem, 1.8rem + 3vw, 3.5rem);
  --gutter:  clamp(1.1rem, 5.5vw, 2rem);
  --col:     36rem;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;overflow-x:clip;background:var(--space-1)}
body{
  margin:0;min-height:100dvh;color:var(--ink);overflow-x:clip;isolation:isolate;
  font-family:var(--font-body);font-size:var(--step-0);line-height:1.55;font-weight:600;text-align:center;
  background:
    radial-gradient(ellipse 120% 60% at 50% 0%,var(--space-3) 0,transparent 70%),
    linear-gradient(var(--space-1),var(--space-2) 55%,var(--space-1));
  -webkit-font-smoothing:antialiased;
}
/* star field (two layers; the second twinkles) */
body::before,body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-repeat:repeat}
body::before{
  background-size:380px 380px;
  background-image:
    radial-gradient(1.4px 1.4px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 110px 80px,#cfe,transparent),
    radial-gradient(1.6px 1.6px at 190px 20px,#fff,transparent),radial-gradient(1px 1px at 260px 150px,#fff,transparent),
    radial-gradient(1.2px 1.2px at 330px 60px,#fde,transparent),radial-gradient(1px 1px at 60px 200px,#fff,transparent),
    radial-gradient(1.5px 1.5px at 150px 260px,#cff,transparent),radial-gradient(1px 1px at 300px 300px,#fff,transparent),
    radial-gradient(1.2px 1.2px at 230px 350px,#fff,transparent),radial-gradient(1px 1px at 20px 340px,#fed,transparent);
}
body::after{
  background-size:290px 290px;
  background-image:
    radial-gradient(2px 2px at 70px 50px,#fff,transparent),radial-gradient(2.2px 2.2px at 220px 120px,var(--cyan),transparent),
    radial-gradient(2px 2px at 140px 190px,var(--sun),transparent),radial-gradient(1.8px 1.8px at 40px 240px,#fff,transparent),
    radial-gradient(2px 2px at 260px 260px,var(--pink),transparent);
}
@media (prefers-reduced-motion: no-preference){ body::after{animation:twinkle 3.6s ease-in-out infinite alternate} }
@keyframes twinkle{from{opacity:.25}to{opacity:1}}

img,svg{display:block;max-width:100%}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:8px}
.wrap{width:min(100% - 2*var(--gutter), var(--col));margin-inline:auto}
section{padding-block:clamp(2.6rem, 9vw, 4.5rem);position:relative}
.copy{max-width:30rem;margin-inline:auto;text-wrap:balance;color:var(--ink-soft)}
.copy + .copy{margin-top:.9em}
.glass{background:var(--glass);border:1px solid var(--glass-b);border-radius:1.5rem;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 12px 40px rgb(0 0 0 / .35),inset 0 1px 0 rgb(255 255 255 / .16)}
.sec{
  font-family:var(--font-display);font-weight:800;font-size:var(--step-3);line-height:1.02;text-wrap:balance;margin-bottom:1.4rem;
  text-shadow:0 0 22px rgb(94 231 255 / .55);position:relative;padding-bottom:.7rem;
}
.sec::after{content:"";position:absolute;left:50%;bottom:0;translate:-50% 0;width:5.5rem;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 0 14px var(--cyan)}

/* ---------- vector art classes ---------- */
.o{stroke:var(--navy);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.s-navy{stroke:var(--navy);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.a-white{fill:#f4f7ff}.a-grey{fill:#b9c3e6}.a-grey2{fill:#8f9bd0}.a-orange{fill:var(--orange)}.a-yellow{fill:var(--sun)}
.a-red{fill:#ff5470}.a-pink{fill:var(--pink)}.a-cyan{fill:var(--cyan)}.a-visor{fill:#1b2a8a}.a-skin{fill:#ffd2a8}.a-navy{fill:var(--navy)}
.a-purple{fill:#8b5cf6}.a-green{fill:#4ade80}.a-blue{fill:#3b82f6}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:.6rem;min-height:3.4rem;padding:.7rem 1.8rem;
  border:0;border-radius:999px;color:var(--navy);text-decoration:none;
  background:linear-gradient(135deg,var(--sun),var(--orange));
  font-family:var(--font-display);font-weight:700;font-size:1.2rem;
  box-shadow:0 0 0 2px rgb(255 255 255 / .35) inset,0 8px 24px rgb(255 143 63 / .45);
  transition:transform .15s,box-shadow .2s,filter .2s;
}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 0 0 2px rgb(255 255 255 / .5) inset,0 12px 30px rgb(255 143 63 / .55)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn--cyan{background:linear-gradient(135deg,#9bf3ff,var(--cyan));box-shadow:0 0 0 2px rgb(255 255 255 / .35) inset,0 8px 24px rgb(94 231 255 / .4)}
.btn--pink{background:linear-gradient(135deg,#ff9be4,var(--pink));box-shadow:0 0 0 2px rgb(255 255 255 / .35) inset,0 8px 24px rgb(255 95 210 / .4)}
.btn--ghost{background:transparent;color:var(--ink);box-shadow:0 0 0 2px rgb(255 255 255 / .5) inset}
.btn--ghost:hover{background:rgb(255 255 255 / .1)}
.btn svg{width:1.3rem;height:1.3rem}

/* ---------- motion ---------- */
@supports (animation-timeline: view()){
  @media (prefers-reduced-motion: no-preference){
    .rise{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 50%}
    @keyframes rise{from{opacity:0;translate:0 2rem;scale:.96}to{opacity:1;translate:0 0;scale:1}}
  }
}
@media (prefers-reduced-motion: no-preference){
  .float{animation:float 6s ease-in-out infinite}
  .float-b{animation:float 7.5s ease-in-out -2s infinite}
  .spin-slow{animation:spin 60s linear infinite}
  .flame{animation:flame .35s ease-in-out infinite alternate;transform-origin:50% 0}
  @keyframes float{50%{translate:0 -.8rem;rotate:3deg}}
  @keyframes spin{to{rotate:360deg}}
  @keyframes flame{to{scale:1 1.25}}
}

/* =====================================================================
   TOOLS
   ===================================================================== */
.tools{position:fixed;inset:max(.7rem,env(safe-area-inset-top)) max(.7rem,env(safe-area-inset-right)) auto max(.7rem,env(safe-area-inset-left));display:flex;justify-content:space-between;z-index:20;pointer-events:none}
.tools > *{pointer-events:auto}
.chip{
  display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:2.9rem;min-width:2.9rem;padding-inline:.9rem;color:var(--ink);
  background:rgb(11 16 51 / .6);border:1px solid var(--glass-b);border-radius:999px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  font-family:var(--font-display);font-weight:700;font-size:.95rem;box-shadow:0 4px 20px rgb(0 0 0 / .4);
}
.chip svg{width:1.25rem;height:1.25rem}
.lang button{all:unset;cursor:pointer;padding:.15rem .45rem;border-radius:999px;opacity:.6}
.lang button[aria-pressed="true"]{opacity:1;background:var(--cyan);color:var(--navy)}
.lang button:focus-visible{outline:3px solid var(--sun)}
#music[hidden]{display:none}
#music .bars{display:none;gap:3px;align-items:flex-end;height:1.1rem}
#music[aria-pressed="true"] .bars{display:flex}
#music[aria-pressed="true"] .ico-note{display:none}
#music[aria-pressed="true"]{box-shadow:0 0 18px var(--cyan)}
.bars i{width:4px;background:var(--cyan);border-radius:2px;animation:eq 1s ease-in-out infinite}
.bars i:nth-child(1){height:40%}.bars i:nth-child(2){height:100%;animation-delay:.2s}.bars i:nth-child(3){height:60%;animation-delay:.4s}
@keyframes eq{50%{transform:scaleY(.3)}}
@media (prefers-reduced-motion: reduce){.bars i{animation:none}}

/* =====================================================================
   GATE
   ===================================================================== */
dialog{border:0;padding:0;background:none;color:inherit;max-width:none;max-height:none}
dialog::backdrop{background:rgb(6 8 30 / .8);backdrop-filter:blur(6px)}
#gate{width:100%;height:100dvh;display:none;place-items:center;padding:1.2rem;overflow:hidden}
#gate[open]{display:grid}
#gate::backdrop{background:radial-gradient(circle at 50% 30%,#3b2a8c,#0b1033 70%)}
.gate-card{
  position:relative;width:min(100%,24rem);padding:7rem 1.6rem 1.8rem;text-align:center;color:var(--ink);
  background:rgb(255 255 255 / .08);border:1px solid var(--glass-b);border-radius:2rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 0 60px rgb(94 231 255 / .25),0 30px 80px rgb(0 0 0 / .5);animation:arrive .8s cubic-bezier(.2,.9,.3,1) both;
}
.gate-card .peek{position:absolute;left:50%;top:-5.5rem;translate:-50% 0;width:9.5rem;height:auto}
.gate-card h2{font-family:var(--font-display);font-weight:800;font-size:var(--step-2);line-height:1.05;margin-bottom:1.4rem;text-wrap:balance;text-shadow:0 0 18px rgb(94 231 255 / .6)}
@keyframes arrive{from{opacity:0;translate:0 3rem;scale:.92}}

/* =====================================================================
   1 · COVER
   ===================================================================== */
.cover{
  min-height:100dvh;padding:max(7.6rem,calc(env(safe-area-inset-top) + 7rem)) var(--gutter) 7rem;position:relative;overflow:clip;
  display:grid;align-content:center;justify-items:center;gap:.9rem;
}
.deco{position:absolute;pointer-events:none}
.deco.saturn{left:-1.6rem;top:3.6rem;width:5.8rem;rotate:-12deg}
.deco.moon{right:1.4rem;top:4.2rem;width:3rem;opacity:.95}
.deco.ufo{right:-1.5rem;top:15rem;width:6.2rem}
.deco.star1{left:12%;top:30%;width:1.3rem}.deco.star2{right:16%;top:44%;width:.9rem}.deco.star3{left:20%;bottom:30%;width:1rem}
.horizon{
  position:absolute;left:50%;bottom:-135vw;translate:-50% 0;width:170vw;max-width:90rem;aspect-ratio:1;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle at 50% 0%,#ffb066 0,#ff6aa8 14%,#9b3fd0 36%,#2a1a6b 62%,#0b1033 80%);
  box-shadow:0 -14px 60px 0 rgb(255 120 160 / .5);
}
.horizon::after{content:"";position:absolute;left:12%;top:2.4%;width:5%;aspect-ratio:1;border-radius:50%;background:rgb(255 255 255 / .12);box-shadow:60vw 3vw 0 -1vw rgb(255 255 255 / .1),30vw 6vw 0 1vw rgb(255 255 255 / .08)}
.cover::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7rem;background:linear-gradient(transparent,var(--space-2));pointer-events:none}
.hello{font-family:var(--font-display);font-weight:700;font-size:var(--step-1);color:var(--ink-soft);position:relative;max-width:17rem;text-wrap:balance}
.name{
  font-family:var(--font-display);font-weight:800;font-size:clamp(4.4rem,26vw,9.5rem);line-height:.9;letter-spacing:-.01em;position:relative;word-break:break-word;
  background:linear-gradient(180deg,#fff3a8 10%,var(--sun) 40%,var(--orange) 80%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 22px rgb(255 190 80 / .55)) drop-shadow(0 4px 0 rgb(11 16 51 / .8));
}
.stage{position:relative;width:min(100%,22rem);margin-top:.5rem}
.porthole{
  width:min(66vw,15.5rem);aspect-ratio:1;margin-inline:auto;border-radius:50%;padding:.8rem;position:relative;
  background:conic-gradient(from 20deg,#eef2ff,#8f9bd0,#f7f9ff,#7581b8,#eef2ff);
  box-shadow:0 0 0 3px var(--navy),0 0 50px rgb(94 231 255 / .45),0 20px 50px rgb(0 0 0 / .5);
}
.porthole::before{content:"";position:absolute;inset:.22rem;border-radius:50%;border:4px dotted var(--navy);opacity:.55}
.porthole .glass-in{width:100%;height:100%;border-radius:50%;overflow:hidden;position:relative;border:4px solid var(--navy);background:#14206e}
.porthole svg{width:100%;height:100%}
.porthole .ph-label{position:absolute;left:50%;bottom:11%;translate:-50% 0;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:.8rem;color:var(--navy);background:#fff;border-radius:999px;padding:.05rem .8rem}
.astro-peek{position:absolute;right:-5.6rem;bottom:-2rem;width:9.2rem;height:auto;z-index:2;filter:drop-shadow(0 8px 14px rgb(0 0 0 / .5))}
.age{
  position:absolute;left:-1.8rem;top:-1.2rem;width:6.6rem;aspect-ratio:1;z-index:3;rotate:-12deg;
  filter:drop-shadow(0 0 16px rgb(255 216 77 / .7));
}
.age .star{position:absolute;inset:0;background:linear-gradient(135deg,var(--sun),var(--orange));clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.age .num{position:absolute;inset:0;display:grid;place-content:center;color:var(--navy);line-height:.9;padding-top:.35rem}
.age:has(b[hidden]){display:none}
.age b{font-family:var(--font-display);font-weight:800;font-size:2.3rem}
.age span{font-family:var(--font-display);font-weight:700;font-size:.78rem}
.facts-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1.6rem;position:relative}
.sticker{
  display:inline-flex;align-items:center;gap:.5rem;padding:.5rem 1rem;border-radius:999px;color:var(--ink);
  background:rgb(11 16 51 / .55);border:1px solid var(--glass-b);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  font-family:var(--font-display);font-weight:600;font-size:1.02rem;box-shadow:0 4px 20px rgb(0 0 0 / .35);
}
.sticker svg{width:1.2rem;height:1.2rem;flex:none;color:var(--cyan)}
.hint{position:absolute;left:50%;bottom:2.2rem;translate:-50% 0;font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:.95rem;z-index:2}

/* =====================================================================
   2 · ASTRONAUT PASS
   ===================================================================== */
.pass{
  position:relative;margin-top:1.6rem;padding:3.2rem 1.3rem 1.5rem;border-radius:1.8rem;text-align:center;
  background:linear-gradient(rgb(20 14 69 / .92),rgb(20 14 69 / .92)) padding-box,conic-gradient(from 0deg,var(--cyan),var(--pink),var(--sun),var(--cyan)) border-box;
  border:2px solid transparent;box-shadow:0 0 40px rgb(94 231 255 / .22),0 14px 40px rgb(0 0 0 / .45);
}
.ribbon{
  position:absolute;left:50%;top:-1.25rem;translate:-50% 0;white-space:nowrap;z-index:2;padding:.35rem 1.4rem;border-radius:999px;
  background:linear-gradient(135deg,var(--cyan),#7c8cff);color:var(--navy);font-family:var(--font-display);font-weight:800;font-size:1rem;letter-spacing:.08em;text-transform:uppercase;
  box-shadow:0 0 20px rgb(94 231 255 / .6);
}
.pass .planet-mini{position:absolute;right:-.9rem;top:-3.4rem;width:5.2rem;rotate:12deg}
.pass .guest{font-family:var(--font-display);font-weight:800;font-size:var(--step-2);line-height:1.05;margin-bottom:1.1rem;text-wrap:balance}
.pass dl{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:.7rem}
.pass dl > div{background:rgb(255 255 255 / .07);border:1px solid rgb(255 255 255 / .16);border-radius:1rem;padding:.55rem .6rem}
.pass dl .full{grid-column:1/-1}
.pass dt{font-family:var(--font-display);font-weight:600;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.pass dd{margin:.05rem 0 0;font-family:var(--font-display);font-weight:700;font-size:1.2rem;line-height:1.2}
.pass dd.msg{font-family:var(--font-body);font-weight:600;font-size:1rem;color:var(--ink-soft)}
.pass .bc{height:2.2rem;margin-top:1.1rem;border-radius:.4rem;opacity:.75;background:repeating-linear-gradient(90deg,#fff 0 2px,transparent 2px 5px,#fff 5px 6px,transparent 6px 10px,#fff 10px 13px,transparent 13px 15px)}
.status{display:inline-flex;align-items:center;gap:.45rem}
.status::before{content:"";width:.7rem;height:.7rem;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun)}

/* =====================================================================
   3 · QUOTE · COUNTDOWN
   ===================================================================== */
.bubble{position:relative;padding:1.6rem 1.4rem;margin-bottom:2.8rem}
.bubble::after{content:"";position:absolute;left:3.6rem;bottom:-1rem;width:1.8rem;height:1.8rem;rotate:45deg;background:rgb(30 28 90);border-right:1px solid var(--glass-b);border-bottom:1px solid var(--glass-b);border-radius:0 0 .5rem 0}
.bubble p{font-family:var(--font-display);font-weight:600;font-size:var(--step-1);line-height:1.3;text-wrap:balance}
.bubble p:first-child{font-weight:800;font-size:var(--step-2);color:var(--sun);text-shadow:0 0 20px rgb(255 216 77 / .6)}
.bubble p + p{margin-top:.7rem;color:var(--ink-soft)}
.talker{display:flex;justify-content:flex-start;margin-top:-1.6rem}
.talker svg{width:8.2rem;height:auto;margin-left:.6rem}
.story{width:min(100%,21rem);margin:2.2rem auto 0;aspect-ratio:4/3;padding:.5rem;position:relative;rotate:-1.5deg;border-radius:1.2rem}
.story .inner{width:100%;height:100%;border-radius:.9rem;overflow:hidden;position:relative;background:#14206e}
.story svg,.story img{width:100%;height:100%;object-fit:cover}
.story .ph-label{position:absolute;left:50%;bottom:.7rem;translate:-50% 0;white-space:nowrap;font-family:var(--font-display);font-weight:700;font-size:.8rem;background:#fff;color:var(--navy);border-radius:999px;padding:.05rem .8rem}
.countdown-title{font-family:var(--font-display);font-weight:700;margin-top:2.4rem;font-size:var(--step-1);color:var(--ink-soft)}
.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-top:.9rem}
.countdown div{aspect-ratio:1;border-radius:50%;display:grid;align-content:center;justify-items:center;position:relative;color:var(--navy)}
.countdown div:nth-child(1){background:radial-gradient(circle at 35% 30%,#ffd1f0,var(--pink) 60%,#b0289a);box-shadow:0 0 22px rgb(255 95 210 / .55)}
.countdown div:nth-child(2){background:radial-gradient(circle at 35% 30%,#fff5b8,var(--sun) 60%,#e0a000);box-shadow:0 0 22px rgb(255 216 77 / .55)}
.countdown div:nth-child(3){background:radial-gradient(circle at 35% 30%,#d4fbff,var(--cyan) 60%,#1ea3c4);box-shadow:0 0 22px rgb(94 231 255 / .55)}
.countdown div:nth-child(4){background:radial-gradient(circle at 35% 30%,#d9ffe3,#4ade80 60%,#1f9f55);box-shadow:0 0 22px rgb(74 222 128 / .55)}
.countdown div::after{content:"";position:absolute;inset:-.35rem;border-radius:50%;border:1px dashed rgb(255 255 255 / .35)}
.countdown b{font-family:var(--font-display);font-weight:800;font-size:clamp(1.6rem,8.5vw,2.6rem);line-height:1;font-variant-numeric:tabular-nums}
.countdown span{font-family:var(--font-display);font-weight:700;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}

/* =====================================================================
   4 · WHERE  (star map)
   ===================================================================== */
.map{overflow:hidden;margin:0 auto 1.4rem;border-radius:1.5rem;position:relative}
.map svg{width:100%;height:auto}
.where-name{font-family:var(--font-display);font-weight:800;font-size:var(--step-2);line-height:1.05;margin-bottom:.9rem;text-shadow:0 0 18px rgb(94 231 255 / .45)}
.chips{display:grid;gap:.6rem;margin-bottom:1.5rem}
.chips .sticker{justify-content:flex-start;text-align:left;border-radius:1.2rem;padding:.7rem 1rem}
.chips .sticker small{display:block;font-family:var(--font-display);font-weight:600;font-size:.76rem;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan)}
.chips .sticker span{display:block;line-height:1.25;font-weight:700}
.actions{display:grid;gap:.9rem;justify-items:center;position:relative}
.menu{position:fixed;margin:0;inset:auto;padding:.5rem;border:1px solid var(--glass-b);border-radius:1.2rem;background:rgb(20 14 69 / .96);color:var(--ink);backdrop-filter:blur(12px);box-shadow:0 16px 50px rgb(0 0 0 / .6);min-width:15rem;text-align:left}
.menu a,.menu button{display:flex;gap:.6rem;align-items:center;width:100%;padding:.8rem .9rem;border:0;background:none;border-radius:.8rem;font-family:var(--font-display);font-weight:600;font-size:1.02rem;color:var(--ink);text-decoration:none;min-height:3rem;text-align:left}
.menu a:hover,.menu button:hover{background:rgb(255 255 255 / .12)}
.menu svg{width:1.2rem;height:1.2rem;color:var(--cyan)}

/* 5 · LODGING */
.lodging-card{padding:1.4rem}

/* =====================================================================
   6 · MISSION PLAN
   ===================================================================== */
.timeline{list-style:none;margin:1.6rem 0 0;padding:0;display:grid;gap:1.1rem;position:relative}
.timeline::before{content:"";position:absolute;left:3.15rem;top:1.5rem;bottom:1.5rem;width:3px;border-radius:3px;background:linear-gradient(var(--cyan),var(--pink),var(--sun));opacity:.7;box-shadow:0 0 12px var(--cyan)}
.timeline li{display:grid;grid-template-columns:6.3rem 1fr;gap:1rem;align-items:center;text-align:left;position:relative}
.timeline svg{width:6.3rem;height:6.3rem;padding:.4rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgb(255 255 255 / .22),rgb(255 255 255 / .06));border:2px solid var(--cyan);box-shadow:0 0 22px rgb(94 231 255 / .45),inset 0 0 18px rgb(94 231 255 / .18)}
.timeline li:nth-child(4n+2) svg{border-color:var(--pink);box-shadow:0 0 22px rgb(255 95 210 / .45),inset 0 0 18px rgb(255 95 210 / .18)}
.timeline li:nth-child(4n+3) svg{border-color:var(--sun);box-shadow:0 0 22px rgb(255 216 77 / .45),inset 0 0 18px rgb(255 216 77 / .18)}
.timeline li:nth-child(4n+4) svg{border-color:#4ade80;box-shadow:0 0 22px rgb(74 222 128 / .45),inset 0 0 18px rgb(74 222 128 / .18)}
.timeline .txt{display:grid;gap:.3rem;justify-items:start}
.timeline time{font-family:var(--font-display);font-weight:700;font-size:.95rem;color:var(--navy);background:var(--cyan);border-radius:999px;padding:.05rem .8rem;box-shadow:0 0 14px rgb(94 231 255 / .6)}
.timeline li:nth-child(4n+2) time{background:var(--pink);box-shadow:0 0 14px rgb(255 95 210 / .6)}
.timeline li:nth-child(4n+3) time{background:var(--sun);box-shadow:0 0 14px rgb(255 216 77 / .6)}
.timeline li:nth-child(4n+4) time{background:#4ade80;box-shadow:0 0 14px rgb(74 222 128 / .6)}
.timeline h3{font-family:var(--font-display);font-weight:800;font-size:var(--step-1);line-height:1.1}

/* =====================================================================
   7 · SUIT · 8 · GIFTS · 9 · NOTICE
   ===================================================================== */
.tag{display:inline-block;font-family:var(--font-display);font-weight:800;font-size:1.15rem;letter-spacing:.04em;padding:.4rem 1.4rem;border-radius:999px;margin-bottom:1.1rem;color:var(--navy);background:linear-gradient(135deg,var(--pink),#ff9be4);box-shadow:0 0 22px rgb(255 95 210 / .55)}
.rule{padding:.9rem 1.1rem;margin-top:.8rem}
.rule b{display:block;font-family:var(--font-display);font-weight:800;font-size:1.15rem;margin-bottom:.15rem;color:var(--cyan)}
.rule span{color:var(--ink-soft)}
.mini-note{margin-top:1.1rem;font-family:var(--font-display);font-weight:600;color:var(--sun)}
.gift-art{width:6.5rem;margin:1.3rem auto 0}
.notice{padding:1.7rem 1.3rem;border-radius:1.8rem;background:linear-gradient(135deg,rgb(255 216 77 / .16),rgb(255 95 210 / .14));border:1px solid rgb(255 216 77 / .45);box-shadow:0 0 30px rgb(255 216 77 / .18)}
.notice .sec{font-size:var(--step-2);text-shadow:none}
.notice .sec::after{background:var(--sun);box-shadow:0 0 14px var(--sun)}
.notice .copy{color:var(--ink)}

/* =====================================================================
   10 · RSVP
   ===================================================================== */
.rsvp{overflow:clip;background:linear-gradient(rgb(255 95 210 / .0),rgb(124 58 237 / .35) 40%,rgb(255 95 210 / .28));border-block:1px solid rgb(255 255 255 / .14)}
.rsvp .wrap{position:relative;z-index:1;padding-bottom:3.5rem}
.deadline{display:inline-block;border-radius:999px;padding:.4rem 1.1rem;margin:1.2rem 0 1.6rem;background:rgb(11 16 51 / .55);border:1px solid var(--glass-b);font-family:var(--font-display);font-weight:700}
.rsvp-actions{display:grid;gap:1rem;justify-items:center}
.rsvp-actions .btn{width:min(100%,19rem);font-size:1.3rem;min-height:3.7rem}
.rsvp .confirmed{display:none;margin-top:.6rem}
.rsvp .confirmed p{font-family:var(--font-display);font-weight:700;font-size:var(--step-2);line-height:1.1;text-wrap:balance}
.rsvp .confirmed strong{color:var(--sun);font-weight:800;text-shadow:0 0 20px rgb(255 216 77 / .7)}
.rsvp .confirmed #confirmed-people{font-size:1.1rem;font-weight:600;margin-top:.9rem;color:var(--ink-soft)}
.rsvp .confirmed .btn{margin-top:1.3rem}
.rsvp[data-state="yes"] .ask,.rsvp[data-state="no"] .ask{display:none}
.rsvp[data-state="yes"] .confirmed,.rsvp[data-state="no"] .confirmed{display:block}
.rocket{position:absolute;right:1rem;bottom:-.4rem;width:4.4rem;z-index:0;rotate:12deg;filter:drop-shadow(0 6px 14px rgb(0 0 0 / .5))}
.rocket.l{left:1rem;right:auto;rotate:-14deg;width:3.2rem;opacity:.85}
@media (prefers-reduced-motion: no-preference){
  .rsvp[data-state="yes"] .rocket.main{animation:launch 2.6s cubic-bezier(.5,0,.9,.4) forwards}
  @keyframes launch{20%{translate:0 .5rem}to{translate:0 -70vh;opacity:0}}
}

#rsvp-dialog{width:min(100% - 1.4rem,27rem);margin:auto;color:var(--ink);background:linear-gradient(rgb(22 14 69),rgb(22 14 69)) padding-box,conic-gradient(from 0deg,var(--cyan),var(--pink),var(--sun),var(--cyan)) border-box;border:2px solid transparent;border-radius:2rem;box-shadow:0 0 60px rgb(94 231 255 / .25),0 30px 80px rgb(0 0 0 / .6)}
#rsvp-dialog[open]{animation:arrive .5s cubic-bezier(.2,.9,.3,1) both}
.form{padding:1.5rem 1.3rem 1.4rem;display:grid;gap:1rem;text-align:left}
.form header{text-align:center}
.form h2{font-family:var(--font-display);font-weight:800;font-size:var(--step-2);line-height:1;text-shadow:0 0 18px rgb(94 231 255 / .55)}
.form .who{margin-top:.3rem;font-family:var(--font-display);font-weight:600;color:var(--ink-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;border:0;padding:0;margin:0}
.seg legend{font-family:var(--font-display);font-weight:700;margin-bottom:.45rem;padding:0;color:var(--cyan)}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0}
.seg span{display:grid;place-items:center;min-height:3.3rem;border:1px solid var(--glass-b);border-radius:1.1rem;font-family:var(--font-display);font-weight:700;font-size:1.05rem;text-align:center;background:rgb(255 255 255 / .06);padding:.3rem;transition:.15s}
.seg input:checked + span{background:linear-gradient(135deg,#9bf3ff,var(--cyan));color:var(--navy);box-shadow:0 0 20px rgb(94 231 255 / .5);border-color:transparent}
.seg input[value="no"]:checked + span{background:linear-gradient(135deg,#ff9be4,var(--pink));box-shadow:0 0 20px rgb(255 95 210 / .5)}
.seg input:focus-visible + span{outline:3px solid var(--sun);outline-offset:2px}
.field label{display:block;font-family:var(--font-display);font-weight:700;margin-bottom:.35rem;color:var(--cyan)}
.field select,.field textarea{width:100%;font:inherit;font-weight:600;font-size:1rem;color:var(--ink);background:rgb(255 255 255 / .08);border:1px solid var(--glass-b);border-radius:1.1rem;padding:.75rem .9rem;min-height:3.2rem}
.field select option{color:#0b1033}
.field textarea{min-height:6rem;resize:vertical}
.field textarea::placeholder{color:var(--ink-soft);opacity:.8}
.form .row{display:grid;grid-template-columns:1fr 1.3fr;gap:.7rem;margin-top:.3rem}
.form .btn{width:100%;padding-inline:1rem}

/* 11 · CONTACT · FOOTER */
.contact .btn{margin-top:1.2rem;background:linear-gradient(135deg,#8bf0ac,#4ade80);box-shadow:0 0 0 2px rgb(255 255 255 / .35) inset,0 8px 24px rgb(74 222 128 / .4)}
footer{padding:2.5rem var(--gutter) calc(2.5rem + env(safe-area-inset-bottom));display:grid;gap:.8rem;justify-items:center}
footer .stars{display:flex;gap:1rem;align-items:center}
footer .stars svg{width:1.4rem}footer .stars svg:nth-child(2){width:2.2rem}
footer .big{font-family:var(--font-display);font-weight:800;font-size:var(--step-3);line-height:1;text-shadow:0 0 22px rgb(255 190 80 / .55);color:var(--sun)}
footer small{font-family:var(--font-display);font-weight:600;font-size:1.1rem;color:var(--ink-soft)}

.toast{position:fixed;left:50%;bottom:max(1.2rem,env(safe-area-inset-bottom));translate:-50% 160%;background:linear-gradient(135deg,var(--sun),var(--orange));color:var(--navy);padding:.8rem 1.3rem;border-radius:999px;font-family:var(--font-display);font-weight:700;z-index:50;opacity:0;visibility:hidden;transition:translate .45s cubic-bezier(.3,1.4,.5,1),opacity .3s,visibility .45s;max-width:calc(100vw - 2rem);text-align:center;box-shadow:0 8px 30px rgb(255 143 63 / .5)}
.toast.show{translate:-50% 0;opacity:1;visibility:visible}
@media (min-width:48rem){:root{--col:38rem}}
@media print{.tools,#gate,.hint{display:none!important}}
</style>
</head>

     TOOLS

<!-- =====================================================================
     GATE
     ===================================================================== -->
<dialog id="gate" aria-labelledby="gate-title">

const store = { get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}} };

const AVAILABLE = CFG.languages?.available?.length ? CFG.languages.available : ["es","en"];
let lang = store.get("inv-lang") || CFG.languages?.default || (navigator.language||"es").slice(0,2);
if(!AVAILABLE.includes(lang) || !T[lang]) lang = CFG.languages?.default || "es";

const get  = (path)=>path.split(".").reduce((o,k)=>o?.[k],CFG);
const pick = (v)=> (v && typeof v==="object" && !Array.isArray(v)) ? (v[lang] ?? v[CFG.languages?.default] ?? Object.values(v)[0]) : v;
const copy = ()=>({ ...T[lang], ...(CFG.copy?.[lang]||{}) });
const TZ   = CFG.event?.timeZone;
const fmt  = (o)=> new Intl.DateTimeFormat(lang, TZ ? {...o, timeZone:TZ} : o);

/* Safe rich text: only <br> / newline become line breaks; everything else is plain text (no HTML injection). */
function setRich(el, str){
  el.textContent = "";
  String(str ?? "").replace(/&amp;/g,"&").split(/<br\s*\/?>|\n/).forEach((part,i)=>{ if(i) el.append(document.createElement("br")); el.append(part); });
}

const EV = {
  start: new Date(CFG.event.start),
  end:   new Date(CFG.event.end || +new Date(CFG.event.start)+6*36e5),
  names: CFG.event.names || [],
  couple: (CFG.event.names||[]).join(" & "),
  rsvpBy: CFG.rsvp?.deadline ? new Date(CFG.rsvp.deadline) : null
};
let answer = CFG.guest?.response?.answer || null;
let people = CFG.guest?.response?.people || CFG.guest?.people || 1;

/* =====================================================================
   RENDER
   ===================================================================== */
const ICON = { arrive:"t-arrive", games:"t-games", food:"t-food", pinata:"t-pinata", cake:"t-cake", ceremony:"t-arrive", party:"t-games", dinner:"t-food", toast:"t-cake" };

function applyConfig(){
  const t = copy();

  // static copy
  $$("[data-i18n]").forEach(el=>{ const v=t[el.dataset.i18n]; if(typeof v==="string") setRich(el,v); });
  $$("[data-i18n-ph]").forEach(el=>{ el.placeholder = t[el.dataset.i18nPh]; });

  // data bindings  (names, guest, venue …)
  $$("[data-bind]").forEach(el=>{
    const k=el.dataset.bind;
    const v = k==="couple" ? EV.couple : pick(get(k));
    setRich(el, v ?? "");
    if("optional" in el.dataset) el.hidden = !v;
  });

  // section switches
  $$("[data-toggle]").forEach(el=>{
    const on = CFG.sections?.[el.dataset.toggle] !== false;
    const target = el.dataset.scope==="section" ? el.closest("section") : el;
    if(target) target.hidden = !on;
  });

  // language switcher: only the languages offered for this event
  $$(".lang button").forEach(b=>{ b.hidden = !AVAILABLE.includes(b.dataset.lang); b.setAttribute("aria-pressed", b.dataset.lang===lang); });
  $(".lang").hidden = AVAILABLE.length < 2;

  // dates
  const dShort = fmt({day:"numeric",month:"long",year:"numeric"});
  const time = fmt({hour:"numeric",minute:"2-digit"}).format(EV.start);
  $("#long-date").textContent = `${fmt({weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(EV.start)} · ${time}`;
  $("#when-v").textContent = `${dShort.format(EV.start)} · ${time}`;
  const P = Object.fromEntries(new Intl.DateTimeFormat("en-US",{day:"2-digit",month:"2-digit",year:"numeric",...(TZ?{timeZone:TZ}:{})}).formatToParts(EV.start).map(p=>[p.type,p.value]));
  $("#cover-date").textContent = [P.day,P.month,P.year.slice(-2)].join(" . ");
  $("#cover-date").setAttribute("aria-label", dShort.format(EV.start));
  if(EV.rsvpBy) $("#deadline").textContent = t.deadline(dShort.format(EV.rsvpBy)); else $("#deadline").hidden = true;

  // «Dino» extras: short date on the cover sticker
  $("#cover-when").textContent = dShort.format(EV.start) + " · " + time;

  // title + a11y
  document.title = `${EV.couple} · ${t.invited.replace(/[¡!]/g,"")}`;

  // itinerary
  const tl = $("#timeline"); tl.textContent = "";
  (CFG.itinerary||[]).forEach(it=>{
    const [h,m] = String(it.time||"00:00").split(":").map(Number);
    const d = new Date(Date.UTC(2000,0,1,h||0,m||0));
    const li = document.createElement("li"); li.className="reveal";
    li.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true"><use href="#${ICON[it.icon]||"t-arch"}"/></svg>`;
    const tm = document.createElement("time"); tm.dateTime = it.time; tm.textContent = new Intl.DateTimeFormat(lang,{hour:"numeric",minute:"2-digit",timeZone:"UTC"}).format(d);
    const h3 = document.createElement("h3"); setRich(h3, pick(it.title));
    const box = document.createElement("div"); box.className="txt"; box.append(tm,h3); li.append(box); tl.append(li);
  });

  // links
  const addr = encodeURIComponent(`${CFG.venue?.name||""} ${CFG.venue?.address||""}`.trim());
  $("#map").href = CFG.venue?.mapUrl || `https://www.google.com/maps/search/?api=1&query=${addr}`;
  const hl = $("#hotels-link"); if(CFG.lodging?.url) hl.href = CFG.lodging.url; else hl.hidden = true;
  const wa = $("#wa"); if(CFG.contact?.whatsapp) wa.href = `https://wa.me/${String(CFG.contact.whatsapp).replace(/\D/g,"")}?text=${encodeURIComponent(EV.couple)}`; else wa.hidden = true;

  // people selector
  const max = Math.max(1, CFG.guest?.maxPeople || CFG.guest?.people || 1), sel = $("#people");
  sel.textContent = "";
  for(let i=1;i<=max;i++){ const o=new Option(String(i),String(i)); o.selected = i===Math.min(people,max); sel.add(o); }

  // photos
  setPhoto("#cover-arch","#cover-ph",CFG.photos?.cover,"eager");
  setPhoto("#story-fig","#story-ph",CFG.photos?.story,"lazy");

  renderRsvp();
}

function setPhoto(box, ph, url, loading){
  const wrap = $(box), svg = $(ph);
  wrap.querySelector("img")?.remove();
  const real = !!url;
  svg.hidden = real; $$(".ph-label",wrap).forEach(l=>l.hidden=real);
  if(real){
    const img = new Image(); img.src=url; img.alt=EV.couple; img.loading=loading; img.decoding="async";
    img.style.cssText="width:100%;height:100%;object-fit:cover";
    wrap.prepend(img);
  } else { wrap.setAttribute("role","img"); wrap.setAttribute("aria-label",EV.couple); }
}

function renderRsvp(){
  const t = copy(), sec = $("#rsvp");
  sec.dataset.state = answer || "";
  if(!answer) return;
  const d = fmt({day:"numeric",month:"long",year:"numeric"}).format(new Date());
  const [a,b,c] = (answer==="yes"?t.yes_text:t.no_text)(d);
  const box = $("#confirmed-text"); box.textContent = a; const st=document.createElement("strong"); st.textContent=b; box.append(st, c);
  $("#confirmed-people").textContent = answer==="yes" ? t.people_text(people) : "";
}

function tick(){
  let ms = Math.max(0, EV.start - Date.now());
  const d=Math.floor(ms/864e5); ms%=864e5; const h=Math.floor(ms/36e5); ms%=36e5; const m=Math.floor(ms/6e4); const s=Math.floor(ms%6e4/1e3);
  const v={d,h,m,s}; $$("#countdown [data-k]").forEach(el=>el.textContent=String(v[el.dataset.k]).padStart(el.dataset.k==="d"?1:2,"0"));
}
function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toast.id); toast.id=setTimeout(()=>el.classList.remove("show"),2800); }

/* =====================================================================
   LANGUAGE
   ===================================================================== */
$$(".lang button").forEach(b=>b.addEventListener("click",()=>{ lang=b.dataset.lang; store.set("inv-lang",lang); applyConfig(); syncMusicLabel(); }));

/* =====================================================================
   MUSIC  (chosen by the host; starts after the guest taps “Ingresar” – browsers require a tap)
   ===================================================================== */
const music = $("#music");
const audio = CFG.music?.src ? new Audio() : null;
let wantPlay = false;
function syncMusicLabel(){
  const on = music.getAttribute("aria-pressed")==="true";
  const lbl = `${copy().music}${CFG.music?.title ? ": "+CFG.music.title : ""}`;
  music.setAttribute("aria-label", lbl); music.title = lbl; music.dataset.on = on;
}
function setPlaying(on){ music.setAttribute("aria-pressed", String(on)); syncMusicLabel(); }
if(audio){
  audio.src = CFG.music.src; audio.loop = CFG.music.loop !== false; audio.preload = "auto"; audio.volume = 0;
  music.hidden = false;
  const fade = (to)=>{ clearInterval(fade.id); fade.id=setInterval(()=>{ const d=to-audio.volume; if(Math.abs(d)<.04){audio.volume=to;clearInterval(fade.id); if(!to) audio.pause();} else audio.volume=Math.min(1,Math.max(0,audio.volume+Math.sign(d)*.04)); },60); };
  const play  = ()=> audio.play().then(()=>{ wantPlay=true; setPlaying(true); fade(.7); }).catch(()=> setPlaying(false));
  const pause = ()=>{ wantPlay=false; setPlaying(false); fade(0); };
  music.addEventListener("click",()=> audio.paused ? play() : pause());
  document.addEventListener("visibilitychange",()=>{ if(document.hidden){ audio.pause(); } else if(wantPlay){ audio.play().catch(()=>{}); } });
  window.__startMusic = play;
}
syncMusicLabel();

/* =====================================================================
   WELCOME GATE
   ===================================================================== */
const gate = $("#gate");
gate.showModal();
gate.addEventListener("cancel",e=>e.preventDefault());
$("#enter").addEventListener("click",()=>{ gate.close(); window.__startMusic?.(); });

/* =====================================================================
   CALENDAR
   ===================================================================== */
const stamp = d=>d.toISOString().replace(/[-:]|\.\d{3}/g,"");
const evTitle = ()=>`${copy().event_of} ${EV.couple}`;
$("#gcal").addEventListener("click",function(){
  this.href = "https://calendar.google.com/calendar/render?action=TEMPLATE"
    + "&text="+encodeURIComponent(evTitle())
    + "&dates="+stamp(EV.start)+"/"+stamp(EV.end)
    + "&location="+encodeURIComponent(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`);
});
$("#ics").addEventListener("click",()=>{
  const esc = s=>String(s).replace(/([,;\\])/g,"\\$1");
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Invitation//EN","BEGIN:VEVENT",
    `UID:${stamp(EV.start)}-${esc(EV.couple)}@invitation`,`DTSTAMP:${stamp(new Date())}`,`DTSTART:${stamp(EV.start)}`,`DTEND:${stamp(EV.end)}`,
    `SUMMARY:${esc(evTitle())}`,`LOCATION:${esc(`${CFG.venue?.name||""}, ${CFG.venue?.address||""}`)}`,"END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([ics],{type:"text/calendar"})); a.download="invitation.ics"; a.click();
  $("#cal-menu").hidePopover?.(); toast(copy().toast_ics);
});
$("#cal-menu").addEventListener("toggle",e=>{
  if(e.newState!=="open") return;
  const r=$("#cal-btn").getBoundingClientRect(), m=e.target, w=m.offsetWidth;
  m.style.top=(r.bottom+8)+"px"; m.style.left=Math.max(12,Math.min(innerWidth-w-12, r.left+r.width/2-w/2))+"px";
});

/* =====================================================================
   RSVP   →  the platform listens to the "invitation:rsvp" event and saves the reply
   ===================================================================== */
const dlg=$("#rsvp-dialog"), form=$("#rsvp-form");
const syncPeople=()=>{ $(".count-wrap").hidden = form.att.value==="no"; };
$$("[data-answer]").forEach(b=>b.addEventListener("click",()=>{ form.att.value=b.dataset.answer; syncPeople(); dlg.showModal(); }));
$("#modify").addEventListener("click",()=>{ form.att.value=answer||"yes"; syncPeople(); dlg.showModal(); });
form.addEventListener("change",syncPeople);
$("#cancel").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{ if(e.target===dlg) dlg.close(); });
form.addEventListener("submit",()=>{
  answer=form.att.value; people = answer==="yes" ? +$("#people").value : 0;
  renderRsvp(); toast(copy().toast_sent);
  document.dispatchEvent(new CustomEvent("invitation:rsvp",{detail:{ guest:CFG.guest?.name, answer, people, message:$("#msg").value.trim() }}));
});

/* init */
applyConfig(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
