<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Palette options</title>
<style>
body{font-family:system-ui,-apple-system,sans-serif;margin:0;padding:32px 16px;background:#F4F6F7;color:#1B2222;max-width:1100px;margin-inline:auto}
h1{margin:0 0 4px}p.s{color:#556B6D;margin:0 0 24px}
.opt{background:#fff;border-radius:20px;padding:22px;margin-bottom:22px;box-shadow:0 1px 3px #0001}
.opt h2{margin:0 0 2px;font-size:20px}.opt .d{color:#556B6D;margin:0 0 14px;font-size:14px}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:16px}
.c{border-radius:12px;padding:12px;min-height:80px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px}
.c b{font-size:13px}
.mock{border-radius:16px;padding:18px;display:grid;gap:14px;grid-template-columns:1.2fr 1fr;align-items:center}
@media(max-width:640px){.mock{grid-template-columns:1fr}}
.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 2px 10px #0001}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;margin-right:4px}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;margin:10px 6px 0 0;font-size:14px}
.hero{border-radius:14px;padding:18px;min-height:110px}
.hero h3{margin:0 0 4px;font-size:20px}
</style></head><body>
<h1>Palette options</h1><p class="s">All keep your base #46C8B2. Each shows palette + a mini UI. Contrast ratio is shown on the buttons.</p>
<div id="root"></div>
<script>
const opts=[
{n:"A · Electric Party",d:"Teal + violet + coral on deep indigo ink. Most energetic, very Gen-Z app feel.",
 ink:"#1E1B3A",bg:"#F6F5FF",c:[["Teal","#46C8B2"],["Violet","#7C5CFF"],["Coral","#FF6B6B"],["Sun","#FFC93C"],["Ink","#1E1B3A"],["Mist","#F6F5FF"]],a:"#7C5CFF",b:"#46C8B2",x:"#FF6B6B"},
{n:"B · Pop Confetti",d:"Teal + hot pink + sunny yellow. Playful and loud, great for parties and birthdays.",
 ink:"#1F2A2E",bg:"#FFF8F1",c:[["Teal","#46C8B2"],["Pink","#FF4D8D"],["Sun","#FFD23F"],["Sky","#4DA8FF"],["Ink","#1F2A2E"],["Cream","#FFF8F1"]],a:"#FF4D8D",b:"#46C8B2",x:"#FFD23F"},
{n:"C · Modern Pro",d:"Teal + deep navy + peach. Most professional and calm, still friendly. Best for planners and suppliers.",
 ink:"#0F2A3D",bg:"#F2F7F8",c:[["Teal","#46C8B2"],["Navy","#0F2A3D"],["Peach","#FF9F7A"],["Ocean","#2F80ED"],["Slate","#5B7083"],["Fog","#F2F7F8"]],a:"#0F2A3D",b:"#46C8B2",x:"#FF9F7A"},
{n:"D · Fresh Tech",d:"Teal + lime + indigo. Clean startup look, fun but still sharp.",
 ink:"#12202B",bg:"#F3FAF8",c:[["Teal","#46C8B2"],["Lime","#B8F34A"],["Indigo","#4B4DED"],["Aqua","#1FB6D4"],["Ink","#12202B"],["Mint","#F3FAF8"]],a:"#4B4DED",b:"#46C8B2",x:"#B8F34A"}
];
const L=h=>{h=h.slice(1);let c=[0,2,4].map(i=>parseInt(h.substr(i,2),16)/255).map(x=>x<=.03928?x/12.92:((x+.055)/1.055)**2.4);return .2126*c[0]+.7152*c[1]+.0722*c[2]};
const cr=(a,b)=>{let[x,y]=[L(a),L(b)].sort((p,q)=>q-p);return ((x+.05)/(y+.05)).toFixed(1)};
const fg=h=>L(h)>.35?"#10181C":"#fff";
document.getElementById('root').innerHTML=opts.map(o=>`<div class="opt"><h2>${o.n}</h2><p class="d">${o.d}</p>
<div class="sw">${o.c.map(([n,h])=>`<div class="c" style="background:${h};color:${fg(h)};${L(h)>.8?'border:1px solid #0002':''}"><b>${n}</b><span>${h}</span></div>`).join('')}</div>
<div class="mock" style="background:${o.bg}">
<div class="hero" style="background:${o.a};color:${fg(o.a)}"><h3>Plan your next party 🎉</h3><div>120 guests · Sat, June 14</div>
<button class="btn" style="background:${o.b};color:${fg(o.b)}">Invite guests · ${cr(o.b,fg(o.b))}:1</button></div>
<div class="card" style="color:${o.ink}"><span class="tag" style="background:${o.b};color:${fg(o.b)}">Wedding</span><span class="tag" style="background:${o.x};color:${fg(o.x)}">New</span>
<h3 style="margin:10px 0 2px">Garden Reception</h3><div style="opacity:.7;font-size:14px">Venue booked · 3 vendors</div>
<button class="btn" style="background:${o.a};color:${fg(o.a)}">Upgrade · ${cr(o.a,fg(o.a))}:1</button></div></div></div>`).join('');
</script></body></html>
